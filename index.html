<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<meta name="theme-color" content="#0b0f19">
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    margin: 0;
    padding-bottom: 70px;
}
.app-container {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
}
.top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
}
.top-header h2 {
    color: #38bdf8;
    margin: 0;
    font-size: 18px;
}
.status-star {
    font-size: 20px;
}
.mode-toggle {
    display: flex;
    background: #131b2e;
    border-radius: 25px;
    padding: 4px;
    margin: 10px 0;
    border: 1px solid #1e293b;
}
.mode-btn {
    flex: 1;
    background: transparent;
    color: #94a3b8;
    border: none;
    padding: 8px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
}
.mode-btn.active {
    background: #22c55e;
    color: #0b0f19;
}
.search-box {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #131b2e;
    color: #f8fafc;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 13px;
}
.match-card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-left: 4px solid #38bdf8;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 13px;
}
.ai-prediction {
    margin-top: 8px;
    padding: 8px;
    background: #0f172a;
    border: 1px dashed #38bdf8;
    border-radius: 8px;
    font-size: 12px;
    color: #38bdf8;
}
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 1000;
}
.nav-item {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 2px;
}
.nav-item.active {
    color: #22c55e;
    font-weight: bold;
}
.nav-item span.icon {
    font-size: 18px;
}
</style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <h2>KELLA Analytics Pro ⚽</h2>
        <span id="connectionStar" class="status-star">⏳</span>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn" onclick="setMode('live', this)">EN DIRECT</button>
        <button class="mode-btn active" onclick="setMode('upcoming', this)">Avant-match</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن فريق..." onkeyup="filterData()">

    <div id="output"></div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('popular', this)"><span class="icon">🔥</span> Populaire</button>
    <button class="nav-item" onclick="switchTab('favorites', this)"><span class="icon">⭐</span> Favoris</button>
    <button class="nav-item" onclick="switchTab('coupon', this)"><span class="icon">🎟️</span> Coupon</button>
    <button class="nav-item" onclick="switchTab('history', this)"><span class="icon">⏰</span> Historique</button>
    <button class="nav-item" onclick="switchTab('menu', this)"><span class="icon">📂</span> Menu</button>
</div>

<script>
let allMatches = [];
let currentMode = 'upcoming';

async function initApp() {
    try {
        const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json');
        if (!response.ok) throw new Error("Server error");
        
        const jsonResult = await response.json();
        // جلب المباريات من مصفوفة response الموجودة في ملف الـ JSON
        allMatches = jsonResult.response || [];
        
        document.getElementById('connectionStar').innerHTML = "🟢";
        renderContent();
    } catch (e) {
        document.getElementById('connectionStar').innerHTML = "🔴";
        document.getElementById('output').innerHTML = `<div style="text-align: center; color: #ef4444; padding: 30px;">تعذر الاتصال بالخادم</div>`;
    }
}

function setMode(mode, btn) {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
    if(btn) btn.classList.add('active');
    currentMode = mode;
    renderContent();
}

function renderContent() {
    const output = document.getElementById('output');
    let html = "";
    
    if (allMatches.length === 0) {
        output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px;">لا توجد مباريات حالياً.</div>`;
        return;
    }

    allMatches.forEach(item => {
        let home = item.teams?.home?.name || "مضيف";
        let away = item.teams?.away?.name || "ضيف";
        let homeGoals = item.goals?.home;
        let awayGoals = item.goals?.away;
        let scoreText = (homeGoals !== undefined && awayGoals !== undefined) ? ` (${homeGoals} - ${awayGoals})` : "";

        html += `
            <div class="match-card">
                <div style="color:#38bdf8; font-weight:bold; margin-bottom: 5px;">🏟️ مباراة قمة</div>
                <div style="font-size: 14px; font-weight: bold;">${home} vs ${away} ${scoreText}</div>
                <div class="ai-prediction">
                    🤖 <b>تحليل الذكاء الاصطناعي:</b> مباراة مثيرة، نسبة الأهداف متقاربة بين الطرفين.
                </div>
            </div>
        `;
    });
    output.innerHTML = html;
}

function switchTab(tab, b) {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
}

function filterData() {
    let q = document.getElementById('searchInput').value.toLowerCase();
    let output = document.getElementById('output');
    let filtered = allMatches.filter(i => {
        let h = i.teams?.home?.name?.toLowerCase() || '';
        let a = i.teams?.away?.name?.toLowerCase() || '';
        return h.includes(q) || a.includes(q);
    });

    if (filtered.length === 0) {
        output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px;">لا توجد نتائج مطابقة.</div>`;
        return;
    }

    let html = "";
    filtered.forEach(item => {
        let home = item.teams?.home?.name || "مضيف";
        let away = item.teams?.away?.name || "ضيف";
        html += `
            <div class="match-card">
                <div style="font-size: 14px; font-weight: bold;">${home} vs ${away}</div>
            </div>
        `;
    });
    output.innerHTML = html;
}

window.onload = initApp;
</script>

</body>
</html>
