<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro - Official API</title>
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    padding: 15px;
    margin: 0;
}
.card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 15px;
    max-width: 480px;
    margin: 0 auto;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
h2 {
    color: #38bdf8;
    text-align: center;
    font-size: 20px;
    margin-top: 0;
}
.subtitle {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 15px;
}
button {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}
.match-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-left: 4px solid #22c55e;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
}
.live-tag {
    background: #ef4444;
    color: white;
    padding: 2px 5px;
    border-radius: 3px;
    font-size: 9px;
    font-weight: bold;
    float: right;
}
</style>
</head>
<body>

<div class="card">
<h2>KELLA Analytics Pro ⚽</h2>
<div class="subtitle">Official API Engine - Khaled</div>

<button onclick="fetchAPIRealData()">⚡ جلب مباريات اليوم الحقيقية من السيرفر الرسمي</button>
<div id="output" style="text-align: center; color: #94a3b8; font-size: 13px; padding: 10px;">انقر الزر للاتصال المباشر بالـ API...</div>
</div>

<script>
const myApiKey = "fd08394f2301a78ecb2b8a3e0db5d3c3";

async function fetchAPIRealData() {
    const output = document.getElementById('output');
    output.innerHTML = "جاري الاتصال بالسيرفر الرسمي وجلب المعطيات الحية...";

    try {
        // تاريخ اليوم الحقيقي 2026-09-15
        const today = new Date().toISOString().split('T')[0];
        const targetUrl = `https://v3.football.api-sports.io/fixtures?date=${today}`;
        
        // تمرير الطلب عبر وسيط آمن لتجاوز حظر المتصفح وعرض البيانات الحقيقية لمفتاحك
        const proxyApiUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl);

        const response = await fetch(proxyApiUrl, {
            headers: {
                "x-apisports-key": myApiKey
            }
        });

        if (!response.ok) throw new Error("فشل الاتصال بالبوابة الرسمية (Status: " + response.status + ")");

        const data = await response.json();
        output.innerHTML = "";

        if (!data.response || data.response.length === 0) {
            output.innerHTML = `<div style="color: #f59e0b; text-align: center; padding: 10px;">لا توجد مباريات مسجلة لهذا اليوم (${today}) في السيرفر الرسمي.</div>`;
            return;
        }

        data.response.forEach(match => {
            let home = match.teams.home.name;
            let away = match.teams.away.name;
            let league = match.league.name;
            let country = match.league.country;
            let homeGoals = match.goals.home !== null ? match.goals.home : "0";
            let awayGoals = match.goals.away !== null ? match.goals.away : "0";
            let status = match.fixture.status.short;
            let time = match.fixture.date.slice(11, 16);

            output.innerHTML += `
                <div class="match-card">
                    <span class="live-tag">${status}</span>
                    <span style="color:#f59e0b; font-weight:bold;">🏆 ${country}: ${league}</span><br>
                    🏟️ <b>${home}</b> vs <b>${away}</b><br>
                    <span style="color:#38bdf8;">التوقيت: ${time} | النتيجة الحية: <b>${homeGoals} - ${awayGoals}</b></span>
                </div>
            `;
        });

    } catch (error) {
        output.innerHTML = `
            <div style="background: #ef444420; border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 12px; text-align: center;">
                ⚠️ تنبيه تقني: ${error.message}<br>السيرفر يطلب تصريح خاص للـ API المباشر.
            </div>
        `;
    }
}
</script>

</body>
</html>
