<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - Live Football</title>
    <meta name="theme-color" content="#0F0F10">
    <style>
        body {
            background: #0F0F10;
            color: #F3F4F6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px; /* مساحة للناف بار */
        }

        .app-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
        }

        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }

        .top-header h2 {
            color: #3b82f6;
            margin: 0;
            font-size: 18px;
        }

        .status-star {
            font-size: 20px;
        }

        .mode-toggle {
            display: flex;
            background: #1f293a;
            border-radius: 25px;
            padding: 4px;
            margin: 10px 0;
            border: 1px solid #1e293b;
        }

        .mode-btn {
            flex: 1;
            background: transparent;
            color: #9ca3af;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }

        .mode-btn.active {
            background: #3b82f6;
            color: #F0F0F0;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #1e293b;
            background: #1f293a;
            color: #F3F4F6;
            border-radius: 13px;
            margin-bottom: 13px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .match-card {
            background: #1f293a;
            border-radius: 13px;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            margin-bottom: 13px;
            font-size: 13px;
            position: relative;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 9px 0;
            z-index: 1000;
        }

        .nav-item {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 2px;
        }

        .nav-item.active {
            color: #3b82f6;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <h2>KELLA Analytics Pro ⚽</h2>
            <span id="connectionStar" class="status-star">🟡</span>
        </div>

        <div id="mainModeToggle" class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('live', this)">EN DIRECT</button>
            <button class="mode-btn" onclick="setMode('upcoming', this)">Avant-match</button>
        </div>

        <div id="searchContainer">
            <input type="text" id="searchInput" class="search-box" placeholder="البحث عن فريق...">
        </div>

        <div id="output"></div>

        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('popular', this)">
                <span style="font-size: 18px;">🔥</span> Populaire
            </button>
            <button class="nav-item" onclick="switchTab('favorites', this)">
                <span style="font-size: 18px;">⭐</span> Favoris
            </button>
            <button class="nav-item" onclick="switchTab('history', this)">
                <span style="font-size: 18px;">🕒</span> Historique
            </button>
            <button class="nav-item" onclick="switchTab('menu', this)">
                <span style="font-size: 18px;">📂</span> Menu
            </button>
        </div>
    </div>

    <script>
        let allMatches = [];
        let currentMode = 'live'; // الافتراضي هو Live
        let currentTab = 'popular';

        // تهيئة التطبيق عند التحميل
        async function initApp() {
            try {
                // تغيير المصدر ليقرأ مباشرة من API-FOOTBALL (v3)
                const today = new Date().toISOString().split('T')[0];
                const url = 'https://v3.football.api-sports.io/fixtures?date=' + today;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'x-apisports-key': 'fd08394f2301a78ecb2b0a3ed0b5d3c3' // مفتاح الـ API الخاص بك هنا
                    }
                });

                if (!response.ok) throw new Error('Network error');

                const data = await response.json();
                
                // معالجة البيانات القادمة من الـ API الجديد
                allMatches = data.response.map(m => ({
                    league: m.league.name,
                    home: m.teams.home.name,
                    away: m.teams.away.name,
                    time: m.fixture.date.substring(11, 16), // استخراج الوقت
                    score: `${m.goals.home} - ${m.goals.away}`,
                    odds: '1: 1.85 | 2: 2.10'
                })) || [];

                document.getElementById('connectionStar').innerHTML = '🟢'; // متصل

            } catch (e) {
                console.error('Error:', e);
                document.getElementById('connectionStar').innerHTML = '🟡'; // خطأ في الاتصال
                allMatches = []; // تعيين مصفوفة فارغة
            }

            // إعادة تصيير المحتوى في كل الحالات (نجاح أو فشل)
            renderContent();
        }

        function setMode(mode, btn) {
            // تحديث الأزرار
            const buttons = document.querySelectorAll('.mode-btn');
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            currentMode = mode;
            renderContent(); // تصيير المحتوى بناءً على الوضع الجديد
        }

        function switchTab(tab, btn) {
            // تحديث أزرار الناف بار
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => item.classList.remove('active'));
            btn.classList.add('active');

            currentTab = tab;
            
            // إخفاء/إظهار مربع البحث بناءً على التبويب
            const searchContainer = document.getElementById('searchContainer');
            if (tab === 'popular') {
                searchContainer.style.display = 'block';
            } else {
                searchContainer.style.display = 'none';
            }

            renderContent(); // تصيير المحتوى بناءً على التبويب الجديد
        }

        function renderContent() {
            const output = document.getElementById('output');

            // التعامل مع حالة عدم وجود مباريات
            if (allMatches.length === 0) {
                output.innerHTML = '<div style="text-align: center; color: #9ca3af; padding: 30px;">لا توجد مباريات في هذا القسم حالياً</div>';
                return;
            }

            // بناء الـ HTML لكل مباراة
            let html = '';
            allMatches.forEach((item, index) => {
                html += `
                    <div class="match-card">
                        <div style="color: #9ca3af; font-size: 11px; margin-bottom: 5px;">🏆 ${item.league}</div>
                        <div style="font-size: 15px; font-weight: bold; color: #F3F4F6; margin: 5px 0;">
                            ${item.home} VS ${item.away}
                        </div>
                        <div style="position: absolute; top: 15px; right: 15px; font-size: 12px; color: #3b82f6; font-weight: bold;">
                            🕒 ${item.time}
                        </div>
                        <div style="background: #0f172a; color: #F3F4F6; border-radius: 7px; padding: 5px; text-align: center; margin-top: 10px; font-weight: bold;">
                            ${item.score}
                        </div>
                        <div style="font-size: 11px; color: #9ca3af; margin-top: 5px; text-align: center;">
                            📊 ${item.odds}
                        </div>
                    </div>
                `;
            });

            output.innerHTML = html;
        }

        // تشغيل التطبيق عند تحميل الصفحة
        window.onload = initApp;

    </script>
</body>
</html>
