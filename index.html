<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - لوحة تحليلات الرياضة</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="min-h-screen p-4 sm:p-6">
    <header class="max-w-3xl mx-auto text-center border-b border-amber-500/30 pb-4 mb-6">
        <h1 class="text-xl sm:text-2xl font-bold text-amber-400 flex items-center justify-center gap-2">
            <span>⚽</span> KELLA Analytics Pro - النظام الذكي
        </h1>
        <p class="text-xs sm:text-sm text-gray-400 mt-1">تتبع الاتصال بـ SportMonks API وعرض استجابات السيرفر لحظياً</p>
    </header>

    <main class="max-w-3xl mx-auto space-y-4">
        <div class="flex justify-between items-center bg-gray-900/80 p-4 rounded-xl border border-amber-500/20 backdrop-blur-sm">
            <div>
                <h2 class="text-sm font-semibold text-amber-300">حالة البيانات الحالية</h2>
                <p id="status-text" class="text-xs text-gray-400">جاري الاتصال بملف live.json...</p>
            </div>
            <button onclick="fetchData()" class="bg-amber-500 hover:bg-amber-400 text-gray-950 px-4 py-2 text-xs sm:text-sm font-bold rounded-lg shadow-lg transition duration-200 flex items-center gap-2 cursor-pointer">
                <span>🔄</span> تحديث وفحص البيانات
            </button>
        </div>

        <div id="content-container" class="bg-gray-900/90 border border-gray-800 rounded-xl p-4 sm:p-6 shadow-xl min-h-[300px] flex flex-col justify-center items-center text-center">
            <div class="animate-pulse text-amber-400 text-sm">جاري قراءة البيانات المحدثة...</div>
        </div>
    </main>

    <script>
        async function fetchData() {
            const container = document.getElementById('content-container');
            const statusText = document.getElementById('status-text');
            
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center space-y-2 py-10">
                    <div class="w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-amber-300">جاري فحص الاستجابة من السيرفر...</p>
                </div>
            `;
            statusText.textContent = "جاري الفحص...";

            try {
                const response = await fetch('live.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('تعذر الوصول إلى ملف live.json (رمز الخطأ: ' + response.status + ')');
                
                const data = await response.json();
                const matches = data.data || [];

                if (Array.isArray(matches) && matches.length > 0) {
                    statusText.textContent = `تم العثور على ${matches.length} عنصر بنجاح`;
                    let html = '<div class="w-full space-y-3 text-right"><h3 class="text-sm font-bold text-amber-400 mb-2">📋 المباريات / البيانات المتاحة:</h3>';
                    
                    matches.forEach((match, index) => {
                        html += `
                            <div class="bg-gray-800/80 border border-amber-500/30 p-3 rounded-lg flex justify-between items-center text-xs sm:text-sm">
                                <span class="font-semibold text-amber-200">عنصر رقم #${index + 1}</span>
                                <span class="text-gray-400 font-mono">ID: ${match.id || 'غير متوفر'}</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                    container.innerHTML = html;
                } else {
                    statusText.textContent = "تم استلام الرد الخام من SportMonks بنجاح";
                    // عرض رسالة توضيحية مع الرد الخام لتكون الواجهة شفافة واحترافية
                    container.innerHTML = `
                        <div class="w-full text-right space-y-3">
                            <div class="bg-amber-500/10 border border-amber-500/30 text-amber-300 p-3 rounded-lg text-xs flex items-start gap-2">
                                <span class="text-base">ℹ️</span>
                                <div>
                                    <p class="font-bold">تنبيه الباقة المجانية:</p>
                                    <p class="text-gray-300 mt-0.5">الباقة المجانية الحالية لا تحتوي على مباريات نشطة في الوقت الحالي. إليك الرد الخام القادم من سيرفر SportMonks حرفياً:</p>
                                </div>
                            </div>
                            <pre class="bg-gray-950 border border-gray-800 p-4 rounded-lg text-left text-emerald-400 font-mono text-xs overflow-x-auto max-h-96" dir="ltr">${JSON.stringify(data, null, 4)}</pre>
                        </div>
                    `;
                }

            } catch (err) {
                statusText.textContent = "حدث خطأ في جلب الملف";
                container.innerHTML = `
                    <div class="text-red-400 text-xs sm:text-sm p-4 bg-red-950/30 border border-red-500/30 rounded-lg">
                        ❌ خطأ في تحميل البيانات: ${err.message}<br>
                        <span class="text-gray-400 text-xs mt-1 block">تأكد من تشغيل الـ Action لإنشاء ملف live.json في المستودع أولاً.</span>
                    </div>
                `;
            }
        }

        // تشغيل الجلب تلقائياً عند تحميل الصفحة
        fetchData();
    </script>
</body>
</html>
