<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KElla_analytic_pro - Multi-Sport Pro</title>
    <meta name="theme-color" content="#0F0F10">
    <style>
        body {
            background: #0F0F10;
            color: #F3F4F6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        /* Splash Screen Style */
        #splashScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0F0F10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .splash-logo {
            font-size: 28px;
            font-weight: bold;
            color: #3b82f6;
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
        }
        .splash-loader {
            width: 40px;
            height: 40px;
            border: 4px solid #1f293a;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .app-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }
        .top-header h2 {
            color: #3b82f6;
            margin: 0;
            font-size: 18px;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .refresh-btn {
            background: #1f293a;
            border: 1px solid #3b82f6;
            color: #3b82f6;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
        }
        .status-star {
            font-size: 16px;
        }
        .mode-toggle {
            display: flex;
            background: #1f293a;
            border-radius: 25px;
            padding: 4px;
            margin: 10px 0;
            border: 1px solid #1e293b;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            color: #9ca3af;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: #ffffff;
        }
        .sports-filter-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 5px 0 10px 0;
            margin-bottom: 10px;
            scrollbar-width: none;
        }
        .sports-filter-scroll::-webkit-scrollbar {
            display: none;
        }
        .sport-chip {
            background: #1f293a;
            border: 1px solid #2d3748;
            color: #9ca3af;
            padding: 8px 14px;
            border-radius: 15px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sport-chip.active {
            background: #3b82f6;
            color: #ffffff;
            border-color: #3b82f6;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #1e293b;
            background: #1f293a;
            color: #F3F4F6;
            border-radius: 13px;
            margin-bottom: 13px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .match-card {
            background: #1f293a;
            border-radius: 13px;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            margin-bottom: 13px;
            font-size: 13px;
            position: relative;
        }
        .match-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 8px;
        }
        .sport-badge-tag {
            background: #0f172a;
            padding: 2px 6px;
            border-radius: 4px;
            color: #3b82f6;
            font-weight: bold;
        }
        .teams-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 10px 0;
        }
        .team-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: bold;
            width: 40%;
        }
        .team-info img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }
        .vs-text {
            color: #9ca3af;
            font-size: 12px;
            font-weight: bold;
        }
        .score-box {
            background: #0f172a;
            color: #F3F4F6;
            border-radius: 7px;
            padding: 6px;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            font-size: 14px;
        }
        .score-box.big-win {
            background: linear-gradient(135deg, #b91c1c, #7f1d1d);
            color: #ffffff;
            border: 1px solid #ef4444;
        }
        .ai-btn {
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #1f293a;
            border: 1px solid #3b82f6;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            color: #F3F4F6;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            direction: rtl;
            text-align: right;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            left: 15px;
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 22px;
            cursor: pointer;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 9px 0;
            z-index: 1000;
        }
        .nav-item {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 2px;
        }
        .nav-item.active {
            color: #3b82f6;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- شاشة البداية (Splash Screen) -->
    <div id="splashScreen">
        <div class="splash-logo">KElla_analytic_pro 🏆<br><span style="font-size: 13px; color: #9ca3af; font-weight: normal;">جاري تحديث البيانات وجلب المباريات...</span></div>
        <div class="splash-loader"></div>
    </div>

    <div class="app-container">
        <div class="top-header">
            <h2>KElla_analytic_pro</h2>
            <div class="header-actions">
                <button class="refresh-btn" onclick="initApp()" title="تحديث مباشر">🔄</button>
                <span id="connectionStar" class="status-star">🟢</span>
            </div>
        </div>

        <div id="mainModeToggle" class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('live', this)">EN DIRECT (مباشر)</button>
            <button class="mode-btn" onclick="setMode('upcoming', this)">Avant-match (قبل اللقاء)</button>
        </div>

        <!-- شريط الرياضات الشامل بكل الأيقونات المطلوبة -->
        <div id="sportsFilterContainer" class="sports-filter-scroll">
            <div class="sport-chip active" onclick="filterBySport('all', this)">⚡ الكل</div>
        </div>

        <div id="searchContainer">
            <input type="text" id="searchInput" class="search-box" placeholder="البحث عن فريق أو بطولة عالمية..." oninput="renderContent()">
        </div>

        <div id="output">
            <div style="text-align: center; color: #9ca3af; padding: 30px;">🔄 جاري تحميل الدوريات والمباريات...</div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('popular', this)">
                <span style="font-size: 18px;">🔥</span> Populaire
            </button>
            <button class="nav-item" onclick="switchTab('favorites', this)">
                <span style="font-size: 18px;">⭐</span> Favoris
            </button>
            <button class="nav-item" onclick="switchTab('history', this)">
                <span style="font-size: 18px;">🕒</span> Historique
            </button>
            <button class="nav-item" onclick="switchTab('menu', this)">
                <span style="font-size: 18px;">📂</span> Menu
            </button>
        </div>
    </div>

    <div id="aiModal" class="modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeAiModal()">&times;</button>
            <h3 style="color: #3b82f6; margin-top: 0; display: flex; align-items: center; gap: 8px;">
                <span>🤖</span> تحليل الذكاء الاصطناعي المتقدم
            </h3>
            <div id="aiModalBody" style="font-size: 13px; line-height: 1.6;"></div>
        </div>
    </div>

    <script>
        let allMatches = [];
        let finishedMatches = [];
        let selectedSport = 'all';
        let currentMode = 'live';
        let currentTab = 'popular';

        // قائمة الرياضات المطلوبة بالكامل مع أيقوناتها الدقيقة
        const supportedSports = [
            { name: "Soccer", emoji: "⚽", label: "كرة القدم" },
            { name: "American Football", emoji: "🏈", label: "الركبي الأمريكي" },
            { name: "Softball", emoji: "🥎", label: "سوفتبول" },
            { name: "Baseball", emoji: "⚾", label: "البيسبول" },
            { name: "Basketball", emoji: "🏀", label: "كرة السلة" },
            { name: "Volleyball", emoji: "🏐", label: "الكرة الطائرة" },
            { name: "Field Hockey", emoji: "🏑", label: "هوكي الحقل" },
            { name: "Ice Hockey", emoji: "🏒", label: "هوكي الجليد" },
            { name: "Cricket", emoji: "🏏", label: "كريكت" },
            { name: "Darts", emoji: "🎯", label: "دارتس" },
            { name: "Archery", emoji: "🏹", label: "رماية" },
            { name: "Bowling", emoji: "🎳", label: "بولينغ" },
            { name: "Diving", emoji: "🤿", label: "غوص" },
            { name: "Martial Arts", emoji: "🥋", label: "فنون قتالية" },
            { name: "Boxing", emoji: "🥊", label: "ملاكمة" },
            { name: "Billiards", emoji: "🎱", label: "بلياردو/سنوكر" },
            { name: "Rugby", emoji: "🪃", label: "ركبي" },
            { name: "Frisbee", emoji: "🥏", label: "فريسبي" },
            { name: "Golf", emoji: "⛳", label: "غولف" }
        ];

        function getTodayDateString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        async function initApp() {
            // إظهار شاشة البداية أثناء التحديث وجلب البيانات
            const splash = document.getElementById('splashScreen');
            splash.style.display = 'flex';
            splash.style.opacity = '1';

            const todayStr = getTodayDateString();
            let fetchedData = false;

            try {
                const response = await fetch(`https://www.thesportsdb.com/api/v1/json/3/eventsday.php?d=${todayStr}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.events && Array.isArray(data.events) && data.events.length > 0) {
                        let liveArr = [];
                        let historyArr = [];

                        data.events.forEach((event, index) => {
                            let sportName = event.strSport || 'Soccer';
                            let homeScore = event.intHomeScore !== null ? parseInt(event.intHomeScore) : null;
                            let awayScore = event.intAwayScore !== null ? parseInt(event.intAwayScore) : null;
                            let statusText = (event.strStatus || 'LIVE').toUpperCase();
                            
                            let isFinished = statusText.includes('FT') || statusText.includes('FINISH');
                            let isScheduled = homeScore === null || awayScore === null || statusText.includes('NS');

                            let matchItem = {
                                id: index,
                                sport: sportName,
                                league: event.strLeague || 'الدوري العالمي الممتاز',
                                home: event.strHomeTeam || 'الفريق المستضيف',
                                away: event.strAwayTeam || 'الفريق الضيف',
                                homeLogo: event.strHomeBadge || 'https://api.iconify.design/fluent-emoji-flat:soccer-ball.svg',
                                awayLogo: event.strAwayBadge || 'https://api.iconify.design/fluent-emoji-flat:soccer-ball.svg',
                                homeScore: homeScore,
                                awayScore: awayScore,
                                date: event.dateEvent || todayStr,
                                time: event.strTime ? event.strTime.substring(0, 5) : '20:00',
                                status: isScheduled ? 'SCHEDULED' : (isFinished ? 'FINISHED' : 'IN_PLAY'),
                                statusText: statusText
                            };

                            if (isFinished) historyArr.push(matchItem);
                            else liveArr.push(matchItem);
                        });

                        allMatches = liveArr;
                        finishedMatches = historyArr;
                        fetchedData = true;
                    }
                }
            } catch (e) {
                console.log('Using offline data fallback...');
            }

            if (!fetchedData) {
                loadDemoData(todayStr);
            }

            buildSportsFiltersUI();
            renderContent();

            // إخفاء شاشة البداية بسلاسة بعد إتمام التحديث
            setTimeout(() => {
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 500);
            }, 800);
        }

        function loadDemoData(todayStr) {
            allMatches = [
                { id: 1, sport: "Soccer", league: "UEFA Champions League (دوري الأبطال)", home: "Real Madrid", away: "Manchester City", homeLogo: "https://www.thesportsdb.com/images/media/team/badge/ryvwpu1421422457.png", awayLogo: "https://www.thesportsdb.com/images/media/team/badge/vwpvry1467462447.png", homeScore: 2, awayScore: 1, date: todayStr, time: "21:00", status: "IN_PLAY", statusText: "78'" },
                { id: 2, sport: "Basketball", league: "NBA Global League", home: "LA Lakers", away: "Boston Celtics", homeLogo: "https://api.iconify.design/fluent-emoji-flat:basketball.svg", awayLogo: "https://api.iconify.design/fluent-emoji-flat:basketball.svg", homeScore: null, awayScore: null, date: todayStr, time: "01:30", status: "SCHEDULED", statusText: "NS" },
                { id: 3, sport: "Tennis", league: "ATP World Tour Masters", home: "Novak Djokovic", away: "Carlos Alcaraz", homeLogo: "https://api.iconify.design/fluent-emoji-flat:tennis.svg", awayLogo: "https://api.iconify.design/fluent-emoji-flat:tennis.svg", homeScore: 1, awayScore: 1, date: todayStr, time: "18:00", status: "IN_PLAY", statusText: "Set 3" },
                { id: 4, sport: "Baseball", league: "MLB Pro Series", home: "New York Yankees", away: "Boston Red Sox", homeLogo: "https://api.iconify.design/fluent-emoji-flat:baseball.svg", awayLogo: "https://api.iconify.design/fluent-emoji-flat:baseball.svg", homeScore: null, awayScore: null, date: todayStr, time: "22:15", status: "SCHEDULED", statusText: "NS" }
            ];
            finishedMatches = [
                { id: 5, sport: "Soccer", league: "La Liga (الدوري الإسباني)", home: "FC Barcelona", away: "Atletico Madrid", homeLogo: "https://www.thesportsdb.com/images/media/team/badge/xzqmua1527756519.png", awayLogo: "https://www.thesportsdb.com/images/media/team/badge/q91ia01527756708.png", homeScore: 3, awayScore: 0, date: todayStr, time: "16:00", status: "FINISHED", statusText: "FT" }
            ];
        }

        function buildSportsFiltersUI() {
            const container = document.getElementById('sportsFilterContainer');
            let html = `<div class="sport-chip ${selectedSport === 'all' ? 'active' : ''}" onclick="filterBySport('all', this)">⚡ الكل</div>`;
            
            supportedSports.forEach(s => {
                let isActive = selectedSport === s.name ? 'active' : '';
                html += `<div class="sport-chip ${isActive}" onclick="filterBySport('${s.name}', this)">${s.emoji} ${s.label}</div>`;
            });

            container.innerHTML = html;
        }

        function filterBySport(sport, el) {
            document.querySelectorAll('.sport-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            selectedSport = sport;
            renderContent();
        }

        function setMode(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
            renderContent();
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            btn.classList.add('active');
            currentTab = tab;
            
            const searchContainer = document.getElementById('searchContainer');
            const sportsFilter = document.getElementById('sportsFilterContainer');
            const output = document.getElementById('output');

            if (tab === 'popular') {
                searchContainer.style.display = 'block';
                sportsFilter.style.display = 'flex';
                renderContent();
            } else if (tab === 'favorites') {
                searchContainer.style.display = 'n
