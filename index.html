<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - Live API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 12px;
            max-width: 450px;
            margin: 0 auto;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
        }
        .result-item {
            background: #0f172a;
            padding: 10px;
            margin-top: 8px;
            border-radius: 6px;
            font-size: 12px;
            border-left: 3px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>KELLA Analytics Pro ⚽</h2>
        <p style="font-size: 12px; color: #94a3b8;">Connexion directe avec RapidAPI</p>
        
        <button onclick="fetchLiveMatches()">Charger les données du Live ⚡</button>
        
        <div id="output">Appuyez sur le bouton pour afficher les données...</div>
    </div>

    <script>
        function fetchLiveMatches() {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = "Chargement en cours...";

            const url = 'https://free-api-live-football-data.p.rapidapi.com/football-players-search?search=m';
            const options = {
                method: 'GET',
                headers: {
                    'x-rapidapi-key': 'f555519eb6msh671e2bbb1d6c7d0p19b43djsn0d4c63a197b5',
                    'x-rapidapi-host': 'free-api-live-football-data.p.rapidapi.com'
                }
            };

            fetch(url, options)
                .then(response => response.json())
                .then(data => {
                    outputDiv.innerHTML = "<h4>Données reçues avec succès :</h4>";
                    // كمثال، نعرض النتيجة الخام أو جزء منها للتأكد من اتصال الـ API
                    console.log(data);
                    outputDiv.innerHTML += `<div class="result-item">Connexion établie ! Regardez la console (F12) pour voir les détails de la réponse.</div>`;
                })
                .catch(err => {
                    console.error(err);
                    outputDiv.innerHTML = `<span style="color: #ef4444;">Erreur de connexion à l'API.</span>`;
                });
        }
    </script>
</body>
</html>
