<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - Live Football</title>
    <meta name="theme-color" content="#0F0F10">
    <style>
        body {
            background: #0F0F10;
            color: #F3F4F6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        .app-container {
            max-width: 400px;
            margin: 0 auto;
            padding: 10px;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }
        .top-header h2 {
            color: #3b82f6;
            margin: 0;
            font-size: 18px;
        }
        .status-star {
            font-size: 20px;
        }
        .mode-toggle {
            display: flex;
            background: #1f293a;
            border-radius: 25px;
            padding: 4px;
            margin: 10px 0;
            border: 1px solid #1e293b;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            color: #9ca3af;
            border: none;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #3b82f6;
            color: #F0F0F0;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: 1px solid #1e293b;
            background: #1f293a;
            color: #F3F4F6;
            border-radius: 13px;
            margin-bottom: 13px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .match-card {
            background: #1f293a;
            border-radius: 13px;
            border-left: 4px solid #3b82f6;
            padding: 12px;
            margin-bottom: 13px;
            font-size: 13px;
            position: relative;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 9px 0;
            z-index: 1000;
        }
        .nav-item {
            background: transparent;
            border: none;
            color: #9ca3af;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 2px;
        }
        .nav-item.active {
            color: #3b82f6;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <h2>KELLA Analytics Pro ⚽</h2>
            <span id="connectionStar" class="status-star">🔴</span>
        </div>

        <div id="mainModeToggle" class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('live', this)">EN DIRECT</button>
            <button class="mode-btn" onclick="setMode('upcoming', this)">Avant-match</button>
        </div>

        <div id="searchContainer">
            <input type="text" id="searchInput" class="search-box" placeholder="البحث عن فريق..." oninput="filterMatches()">
        </div>

        <div id="output">
            <div style="text-align: center; color: #9ca3af; padding: 30px;">جاري جلب المباريات الحقيقية من API...</div>
        </div>

        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('popular', this)">
                <span style="font-size: 18px;">🔥</span> Populaire
            </button>
            <button class="nav-item" onclick="switchTab('favorites', this)">
                <span style="font-size: 18px;">⭐</span> Favoris
            </button>
            <button class="nav-item" onclick="switchTab('history', this)">
                <span style="font-size: 18px;">🕒</span> Historique
            </button>
            <button class="nav-item" onclick="switchTab('menu', this)">
                <span style="font-size: 18px;">📂</span> Menu
            </button>
        </div>
    </div>

    <script>
        let allMatches = [];
        let currentMode = 'live';
        let currentTab = 'popular';
        const AUTH_TOKEN = "3d9f5cb78f521d0803";

        async function initApp() {
            try {
                // استعملنا بروكسي لتجاوز قيود CORS الخاصة بالمتصفحات
                const proxyUrl = 'https://api.allorigins.win/raw?url=';
                const targetUrl = encodeURIComponent('https://api.football-data.org/v4/matches');
                
                const response = await fetch(proxyUrl + targetUrl, {
                    headers: {
                        'X-Auth-Token': AUTH_TOKEN
                    }
                });
                
                if (!response.ok) throw new Error('Network response failed');

                const data = await response.json();
                
                if (data.matches && Array.isArray(data.matches)) {
                    allMatches = data.matches.map(match => {
                        let scoreText = match.status;
                        if (match.score && match.score.fullTime && match.score.fullTime.home !== null) {
                            scoreText = `${match.score.fullTime.home} - ${match.score.fullTime.away} (${match.status})`;
                        } else {
                            scoreText = match.status === 'SCHEDULED' ? 'مبكرة / لم تبدأ بعد' : match.status;
                        }

                        return {
                            league: match.competition?.name || 'Football Match',
                            home: match.homeTeam?.name || 'Home Team',
                            away: match.awayTeam?.name || 'Away Team',
                            time: match.utcDate ? match.utcDate.substring(11, 16) : '--:--',
                            score: scoreText,
                            status: match.status,
                            odds: "1: 1.90 | X: 3.40 | 2: 2.10"
                        };
                    });
                    document.getElementById('connectionStar').innerHTML = '🟢';
                } else {
                    allMatches = [];
                    document.getElementById('connectionStar').innerHTML = '🟡';
                }
            } catch (e) {
                console.error('Error fetching matches:', e);
                document.getElementById('connectionStar').innerHTML = '🔴';
                allMatches = [];
            }

            renderContent();
        }

        function setMode(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
            renderContent();
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            btn.classList.add('active');
            currentTab = tab;
            
            document.getElementById('searchContainer').style.display = (tab === 'popular') ? 'block' : 'none';
            renderContent();
        }

        function filterMatches() {
            renderContent();
        }

        function renderContent() {
            const output = document.getElementById('output');
            const searchVal = document.getElementById('searchInput') ? document.getElementById('searchInput').value.toLowerCase() : '';

            let filtered = allMatches.filter(item => {
                const home = (item.home || '').toLowerCase();
                const away = (item.away || '').toLowerCase();
                const league = (item.league || '').toLowerCase();
                
                // فلترة حسب الوضع (مباشر ولا مباريات قادمة)
                if (currentMode === 'live') {
                    // المباريات الجارية أو المكتملة حديثاً
                    if (item.status === 'SCHEDULED') return false;
                } else {
                    // المباريات المجدولة/القادمة
                    if (item.status !== 'SCHEDULED') return false;
                }

                return home.includes(searchVal) || away.includes(searchVal) || league.includes(searchVal);
            });

            if (filtered.length === 0) {
                output.innerHTML = `<div style="text-align: center; color: #9ca3af; padding: 30px;">لا توجد مباريات مطابقة حالياً في وضع (${currentMode === 'live' ? 'المباشر' : 'Avant-match'})</div>`;
                return;
            }

            let html = '';
            filtered.forEach(item => {
                html += `
                    <div class="match-card">
                        <div style="color: #9ca3af; font-size: 11px; margin-bottom: 5px;">🏆 ${item.league}</div>
                        <div style="font-size: 15px; font-weight: bold; color: #F3F4F6; margin: 5px 0;">
                            ${item.home} VS ${item.away}
                        </div>
                        <div style="position: absolute; top: 15px; right: 15px; font-size: 12px; color: #3b82f6; font-weight: bold;">
                            🕒 ${item.time}
                        </div>
                        <div style="background: #0f172a; color: #F3F4F6; border-radius: 7px; padding: 5px; text-align: center; margin-top: 10px; font-weight: bold;">
                            ${item.score}
                        </div>
                        <div style="font-size: 11px; color: #9ca3af; margin-top: 5px; text-align: center;">
                            📊 ${item.odds}
                        </div>
                    </div>
                `;
            });

            output.innerHTML = html;
        }

        window.onload = initApp;
    </script>
</body>
</html>
