<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    padding: 15px;
    margin: 0;
}
.card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 15px;
    max-width: 480px;
    margin: 0 auto;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
h2 {
    color: #38bdf8;
    text-align: center;
    font-size: 20px;
    margin-top: 0;
}
.subtitle {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 15px;
}
button {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}
.match-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-left: 4px solid #22c55e;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
}
</style>
</head>
<body>

<div class="card">
<h2>KELLA Analytics Pro ⚽</h2>
<div class="subtitle">Live Global Engine - Khaled</div>

<button onclick="loadLiveMatches()">⚡ جلب كل مباريات ودوريات اليوم</button>
<div id="output" style="text-align: center; color: #94a3b8; font-size: 13px; padding: 10px;">انقر الزر لعرض جدول المباريات الشامل...</div>
</div>

<script>
async function loadLiveMatches() {
    const output = document.getElementById('output');
    output.innerHTML = "جاري جلب جميع المباريات...";

    try {
        const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("تعذر جلب قاعدة البيانات.");

        const data = await response.json();
        output.innerHTML = "";

        if (!data.response || data.response.length === 0) {
            output.innerHTML = `<div style="color: #f59e0b; text-align: center; padding: 10px;">لا توجد مباريات مسجلة لليوم.</div>`;
            return;
        }

        // عرض كل المباريات مع حماية البيانات الفارغة
        data.response.forEach(item => {
            let leagueName = (item.league && item.league.name) ? item.league.name : "بطولة رسمية";
            let country = (item.league && item.league.country) ? item.league.country : "عالمي";
            let home = (item.teams && item.teams.home) ? item.teams.home.name : "مضيف";
            let away = (item.teams && item.teams.away) ? item.teams.away.name : "ضيف";
            let status = (item.fixture && item.fixture.status) ? item.fixture.status.short : "NS";
            let goalsHome = (item.goals && item.goals.home !== null) ? item.goals.home : "-";
            let goalsAway = (item.goals && item.goals.away !== null) ? item.goals.away : "-";

            output.innerHTML += `
                <div class="match-card">
                    <span style="color:#ef4444; font-weight:bold; float:right;">${status}</span>
                    <span style="color:#38bdf8; font-weight:bold;">🌍 ${country} - ${leagueName}</span><br>
                    🏟️ <b>${home}</b> vs <b>${away}</b><br>
                    <span style="color:#22c55e;">النتيجة: <b>${goalsHome} - ${goalsAway}</b></span>
                </div>
            `;
        });

    } catch (err) {
        output.innerHTML = `
            <div style="background: #ef444420; border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px;">
                ⚠️ تنبيه: ${err.message}
            </div>
        `;
    }
}
</script>

</body>
</html>
