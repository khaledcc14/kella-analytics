<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - Global Live Center</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 10px;
        }
        header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 18px;
            color: #38bdf8;
            margin-bottom: 3px;
        }
        .notif-bar {
            background: #1e293b;
            border: 1px solid #334155;
            padding: 8px;
            border-radius: 8px;
            font-size: 11px;
            color: #38bdf8;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .widget-container {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>KELLA Analytics Pro ⚽</h1>
        <p style="font-size: 10px; color: #94a3b8;">Centre Mondial des Matchs en Direct & IA</p>
    </header>

    <!-- شريط الإشعارات والتحكم -->
    <div class="notif-bar" id="notifBar">
        🔔 Centre mondial connecté : Tous les championnats du monde en direct !
        <br><button onclick="requestNotificationPermission()" style="margin-top:5px; padding:4px 8px; background:#0284c7; color:white; border:none; border-radius:4px; font-size:10px; cursor:pointer;">Activer les alertes</button>
    </div>

    <!-- فضاء عرض كل مباريات العالم الحية تلقائياً (بدون قيود وبدون عدد محدود) -->
    <div class="widget-container">
        <iframe src="https://www.scorebat.com/embed/livescore/" frameborder="0" width="100%" height="650px" allowfullscreen style="display:block;"></iframe>
    </div>

    <script>
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Ce navigateur ne supporte pas les notifications.");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    document.getElementById('notifBar').style.background = "#166534";
                    document.getElementById('notifBar').style.color = "#dcfce7";
                    document.getElementById('notifBar').innerHTML = "✅ Notifications et alertes mondiales activées !";
                    new Notification("KELLA Analytics Pro", { body: "Le système d'alertes live est opérationnel !" });
                } else {
                    alert("Permission refusée pour les notifications.");
                }
            });
        }
    </script>
</body>
</html>
