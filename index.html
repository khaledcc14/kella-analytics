<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - Real Stream</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #131b2e;
            border: 1px solid #1e293b;
            padding: 18px;
            border-radius: 18px;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
            font-size: 22px;
        }
        .subtitle {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 15px;
        }
        button.main-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .match-card {
            background: #0f172a;
            padding: 14px;
            margin-top: 10px;
            border-radius: 12px;
            border-left: 4px solid #22c55e;
            font-size: 13px;
            border: 1px solid #1e293b;
        }
        .status-badge {
            background: #ef4444;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            float: right;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>KELLA Analytics Pro ⚽</h2>
        <div class="subtitle">Real API Engine - Khaled</div>

        <button class="main-btn" onclick="fetchRealMatches()">⚡ جلب مباريات اليوم الحقيقية من السيرفر</button>
        
        <div id="output" style="text-align: center; color: #94a3b8; padding: 15px 0;">
            انقر الزر لجلب البيانات الحية المباشرة...
        </div>
    </div>

    <script>
        const apiKey = "fd08394f2301a78ecb2b8a3e0db5d3c3";

        async function fetchRealMatches() {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = `<div style="color: #38bdf8; padding: 10px;">جاري جلب المباريات الحقيقية عبر السيرفر الآمن...</div>`;

            try {
                const today = new Date().toISOString().split('T')[0];
                const apiUrl = `https://v3.football.api-sports.io/fixtures?date=${today}`;
                // استخدام بروكسي نظيف يدعم المفتاح رسمياً
                const proxyUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(apiUrl);

                const response = await fetch(proxyUrl, {
                    headers: {
                        "x-apisports-key": apiKey
                    }
                });

                if (!response.ok) throw new Error("خطأ في الاتصال بالبوابة (Status: " + response.status + ")");

                const data = await response.json();
                outputDiv.innerHTML = "";

                if (!data.response || data.response.length === 0) {
                    outputDiv.innerHTML = `<div style="color: #f59e0b; padding: 10px;">لا توجد مباريات مسجلة لهذا اليوم (${today}) في السيرفر الرسمي.</div>`;
                    return;
                }

                data.response.forEach(match => {
                    let home = match.teams.home.name;
                    let away = match.teams.away.name;
                    let league = match.league.name;
                    let country = match.league.country;
                    let homeScore = match.goals.home !== null ? match.goals.home : "0";
                    let awayScore = match.goals.away !== null ? match.goals.away : "0";
                    let status = match.fixture.status.short;
                    let time = match.fixture.date.slice(11, 16);

                    outputDiv.innerHTML += `
                        <div class="match-card">
                            <span class="status-badge">${status}</span>
                            <div style="font-size: 10px; color: #f59e0b; font-weight: bold;">🏆 ${country}: ${league} | ⏰ ${time}</div>
                            <div style="font-weight: bold; font-size: 14px; margin: 6px 0;">🏟️ ${home} vs ${away}</div>
                            <div style="color: #38bdf8; font-size: 12px;">النتيجة الحية: <b>${homeScore} - ${awayScore}</b></div>
                        </div>
                    `;
                });

            } catch (error) {
                outputDiv.innerHTML = `
                    <div style="background: #ef444420; border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 12px; text-align: center;">
                        ⚠️ تنبيه: ${error.message}<br>يرجى التأكد من أن الاتصال يعمل عبر رابط GitHub Pages الخاص بك.
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
