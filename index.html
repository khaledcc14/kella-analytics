<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - منصة التحليل الرياضي الذكي</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --gold-primary: #d4af37;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--gold-primary);
        }
        .logo-area h1 {
            margin: 0;
            font-size: 20px;
            color: var(--gold-primary);
        }
        .logo-area span {
            font-size: 12px;
            color: var(--text-muted);
        }
        /* زر الموسيقى الاحترافي */
        .sound-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .sound-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-color);
        }
        .main-container {
            padding: 25px;
            max-width: 1000px;
            margin: auto;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card h3 {
            margin-top: 0;
            color: var(--gold-primary);
        }
    </style>
</head>
<body>

    <!-- الهيدر الخاص بالتطبيق -->
    <header>
        <div class="logo-area">
            <h1>KELLA Analytics Pro ⚽</h1>
            <span>أداة منطقية للتحليل الرياضي وتقليل المخاطر</span>
        </div>
        
        <!-- زر التحكم في الموسيقى المح المحلية -->
        <button id="sound-toggle-btn" class="sound-btn" onclick="toggleMusic()">
            🔇 <span>تشغيل الموسيقى</span>
        </button>
    </header>

    <!-- محتوى التطبيق الأساسي -->
    <div class="main-container">
        
        <!-- قسم التنبيه التوعوي والأخلاقي -->
        <div class="card" style="border-color: var(--gold-primary);">
            <h3>🎯 الهدف من المنصة</h3>
            <p>توفير قراءات رياضية دقيقة، مبنية على الأرقام والاحتمالات المنطقية البحتة، بعيداً عن العشوائية لترسيخ الوعي الرشيد.</p>
        </div>

        <!-- قسم لوحة المباريات والتحليلات -->
        <div class="card">
            <h3>📊 لوحة التحليلات الحية والمباريات</h3>
            <p id="matches-status">جاري مزامنة البيانات الرياضية وتحميل الاحتمالات...</p>
            <!-- هنا يتم جلب أو عرض مبارياتك وأكوادك الخاصة -->
        </div>

    </div>

    <!-- عنصر الصوت الصامت في الخلفية يقرأ من مجلد sounds -->
    <audio id="bg-music" loop preload="auto">
        <source src="sounds/background.mp3" type="audio/mpeg">
        متصفحك لا يدعم تشغيل الملفات الصوتية.
    </audio>

    <!-- سكربت التحكم في الصوت وتشغيل الأيقونات -->
    <script>
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('sound-toggle-btn');
            
            if (music.paused) {
                music.play().then(() => {
                    btn.innerHTML = '🎵 <span>إيقاف الموسيقى</span>';
                }).catch(error => {
                    console.log("التشغيل يتطلب تفاعل المستخدم:", error);
                });
            } else {
                music.pause();
                btn.innerHTML = '🔇 <span>تشغيل الموسيقى</span>';
            }
        }
    </script>

</body>
</html>
