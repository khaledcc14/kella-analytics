<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f19">
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    padding: 15px;
    margin: 0;
}
.card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 15px;
    max-width: 480px;
    margin: 0 auto;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
.header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 5px;
}
h2 {
    color: #38bdf8;
    margin: 0;
    font-size: 20px;
}
/* مؤشر النجمة الحي (أخضر متصل / أحمر منفصل) */
.status-star {
    font-size: 22px;
    cursor: pointer;
    transition: 0.3s;
    filter: drop-shadow(0 0 4px rgba(0,0,0,0.5));
}
.subtitle {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 15px;
}
button {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}
.search-box {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #1e293b;
    background: #0f172a;
    color: #f8fafc;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 13px;
}
.filter-tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
}
.tab-btn {
    flex: 1;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #38bdf820;
    border-radius: 8px;
    padding: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin: 0;
}
.tab-btn.active {
    background: #0284c7;
    color: white;
    border-color: #38bdf8;
}
.leagues-container {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 5px;
    margin-bottom: 10px;
}
.league-btn {
    background: #1e293b;
    color: #38bdf8;
    border: 1px solid #38bdf840;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
    transition: 0.2s;
    width: auto;
    margin: 0;
}
.league-btn:hover, .league-btn.active {
    background: #38bdf8;
    color: #0b0f19;
    font-weight: bold;
}
.match-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-left: 4px solid #22c55e;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
}
.match-card.live {
    border-left-color: #ef4444;
}
.match-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    border-top: 1px solid #1e293b;
    padding-top: 6px;
}
.ai-prediction {
    margin-top: 8px;
    padding: 10px;
    background: #1e293b80;
    border: 1px dashed #38bdf8;
    border-radius: 8px;
    font-size: 11px;
    color: #38bdf8;
    line-height: 1.5;
    word-break: break-word;
}
</style>
</head>
<body>

<div class="card">
<div class="header-row">
    <h2>KELLA Analytics Pro ⚽</h2>
    <!-- مؤشر النجمة: خضراء (متصل) / حمراء (منقطع) -->
    <span id="connectionStar" class="status-star" title="حالة الاتصال بالمنصة">🔴</span>
</div>
<div class="subtitle">Live Global Engine & AI Predictor - Khaled</div>

<button onclick="loadLiveMatches()">⚡ تحديث وجلب مباريات اليوم</button>
<input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن فريق أو دوري..." onkeyup="filterMatches()">

<!-- أزرار الحالة -->
<div class="filter-tabs">
    <button class="tab-btn active" onclick="setStatusFilter('all', this)">الكل 🌍</button>
    <button class="tab-btn" onclick="setStatusFilter('live', this)">🔴 مباشرة</button>
    <button class="tab-btn" onclick="setStatusFilter('upcoming', this)">⏰ قريباً</button>
</div>

<!-- أزرار الدوريات (مع إضافة الدوري السعودي ودوري الأبطال) -->
<div class="leagues-container">
    <button class="league-btn active" onclick="filterByLeague('all', this)">الكل</button>
    <button class="league-btn" onclick="filterByLeague('champions league', this)">⭐ الأبطال</button>
    <button class="league-btn" onclick="filterByLeague('saudi', this)">🇸🇦 السعودية</button>
    <button class="league-btn" onclick="filterByLeague('spain', this)">🇪🇸 إسبانيا</button>
    <button class="league-btn" onclick="filterByLeague('france', this)">🇫🇷 فرنسا</button>
    <button class="league-btn" onclick="filterByLeague('england', this)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا</button>
    <button class="league-btn" onclick="filterByLeague('italy', this)">🇮🇹 إيطاليا</button>
    <button class="league-btn" onclick="filterByLeague('brazil', this]">🇧🇷 البرازيل</button>
</div>

<div id="output" style="text-align: center; color: #94a3b8; font-size: 13px; padding: 10px;">جاري تشغيل المحرك السريع...</div>
</div>

<script>
let allMatches = [];
let currentLeagueFilter = 'all';
let currentStatusFilter = 'all';

function setConnectionStatus(isConnected) {
    const star = document.getElementById('connectionStar');
    if (isConnected) {
        star.innerHTML = "🟢";
        star.title = "متصل بالمنصة بنجاح";
    } else {
        star.innerHTML = "🔴";
        star.title = "منقطع أو تعذر الاتصال";
    }
}

async function loadLiveMatches() {
    const output = document.getElementById('output');
    output.innerHTML = "جاري مزامنة البيانات وتحليل اللقاءات...";

    try {
        const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("تعذر جلب ملف البيانات.");

        const data = await response.json();
        
        if (Array.isArray(data)) {
            allMatches = data;
        } else if (data && Array.isArray(data.response)) {
            allMatches = data.response;
        } else {
            allMatches = [];
        }

        setConnectionStatus(true); // اتصال ناجح -> نجمة خضراء
        applyFilters();

    } catch (err) {
        setConnectionStatus(false); // خطأ في الاتصال -> نجمة حمراء
        output.innerHTML = `
            <div style="background: #ef444420; border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px;">
                ⚠️ تنبيه الاتصال: ${err.message}
            </div>
        `;
    }
}

function generateAIPrediction(home, away) {
    let hash = (home + away).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
    let scoreH = hash % 3;
    let scoreA = (hash + 1) % 3;
    let prob = 45 + (hash % 20);

    return `
        🤖 <b>التوقعات والنتيجة:</b> ${home} (${scoreH}) - (${scoreA}) ${away} | 📊 نسبة فوز المضيف: ${prob}%<br>
        💡 <b>قراءة سريعة:</b> لقاء مفتوح على كل الاحتمالات مع أفضلية طفيفة لتسجيل أهداف مبكرة.
    `;
}

function displayMatches(matches) {
    const output = document.getElementById('output');
    
    if (matches.length === 0) {
        output.innerHTML = `<div style="color: #f59e0b; text-align: center; padding: 15px;">لا توجد مباريات مطابقة للخيارات الحالية.</div>`;
        return;
    }

    // بناء HTML بشكل خفيف وسريع لتجنب الثقل
    let htmlContent = "";
    matches.forEach(item => {
        let leagueName = (item.league && item.league.name) ? item.league.name : "بطولة رسمية";
        let country = (item.league && item.league.country) ? item.league.country : "عالمي";
        let home = (item.teams && item.teams.home) ? item.teams.home.name : "مضيف";
        let away = (item.teams && item.teams.away) ? item.teams.away.name : "ضيف";
        let status = (item.fixture && item.fixture.status) ? item.fixture.status.short : "NS";
        let elapsed = (item.fixture && item.fixture.status && item.fixture.status.elapsed) ? item.fixture.status.elapsed : null;
        
        let matchDateStr = (item.fixture && item.fixture.date) ? item.fixture.date : "";
        let matchTime = matchDateStr ? new Date(matchDateStr).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : "";

        let goalsHome = (item.goals && item.goals.home !== null) ? item.goals.home : "-";
        let goalsAway = (item.goals && item.goals.away !== null) ? item.goals.away : "-";

        let isLive = ["1H", "2H", "ET", "P", "LIVE"].includes(status);
        let cardClass = isLive ? "match-card live" : "match-card";
        let statusColor = isLive ? "#ef4444" : "#94a3b8";

        let statusDesc = status;
        if (status === "NS") statusDesc = "لم تبدأ بعد";
        else if (status === "HT") statusDesc = "استراحة (HT)";
        else if (status === "FT") statusDesc = "انتهت (FT)";
        else if (isLive && elapsed) statusDesc = `${status} (${elapsed}')`;

        let aiText = generateAIPrediction(home, away);

        htmlContent += `
            <div class="${cardClass}">
                <span style="color:${statusColor}; font-weight:bold; float:right;">${status}</span>
                <span style="color:#38bdf8; font-weight:bold;">🌍 ${country} - ${leagueName}</span><br>
                🏟️ <b>${home}</b> vs <b>${away}</b><br>
                <span style="color:#22c55e;">النتيجة: <b>${goalsHome} - ${goalsAway}</b></span>
                
                <div class="match-info-row">
                    <span>⏰ التوقيت: <b>${matchTime || 'غير محدد'}</b></span>
                    <span>⏳ الحالة: <b>${statusDesc}</b></span>
                </div>

                <div class="ai-prediction">
                    ${aiText}
                </div>
            </div>
        `;
    });
    output.innerHTML = htmlContent;
}

function setStatusFilter(statusType, btn) {
    currentStatusFilter = statusType;
    document.querySelectorAll('.filter-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
}

function filterByLeague(leagueKey, btn) {
    currentLeagueFilter = leagueKey;
    document.querySelectorAll('.leagues-container .league-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
}

function filterMatches() {
    applyFilters();
}

function applyFilters() {
    let query = document.getElementById('searchInput').value.toLowerCase();

    let filtered = allMatches.filter(item => {
        let league = (item.league && item.league.name) ? item.league.name.toLowerCase() : "";
        let country = (item.league && item.league.country) ? item.league.country.toLowerCase() : "";
        let homeTeam = (item.teams && item.teams.home) ? item.teams.home.name.toLowerCase() : "";
        let awayTeam = (item.teams && item.teams.away) ? item.teams.away.name.toLowerCase() : "";
        let status = (item.fixture && item.fixture.status) ? item.fixture.status.short : "NS";

        let isLive = ["1H", "2H", "ET", "P", "LIVE"].includes(status);
        let isUpcoming = status === "NS";

        let matchesStatusTab = true;
        if (currentStatusFilter === 'live') matchesStatusTab = isLive;
        else if (currentStatusFilter === 'upcoming') matchesStatusTab = isUpcoming;

        let matchesLeagueBtn = true;
        if (currentLeagueFilter !== 'all') {
            let key = currentLeagueFilter.toLowerCase();
            matchesLeagueBtn = league.includes(key) || country.includes(key);
        }

        let matchesSearch = league.includes(query) || homeTeam.includes(query) || awayTeam.includes(query) || country.includes(query);

        return matchesStatusTab && matchesLeagueBtn && matchesSearch;
    });

    displayMatches(filtered);
}

window.onload = loadLiveMatches;
</script>

</body>
</html>
