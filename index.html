<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f19">
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    margin: 0;
    padding-bottom: 70px; /* ترك مساحة للشريط السفلي */
}
.app-container {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
}
/* الشريط العلوي */
.top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
}
.top-header h2 {
    color: #38bdf8;
    margin: 0;
    font-size: 18px;
}
.status-star {
    font-size: 20px;
    cursor: pointer;
}
/* أزرار التبديل (En direct / Avant-match) */
.mode-toggle {
    display: flex;
    background: #131b2e;
    border-radius: 25px;
    padding: 4px;
    margin: 10px 0;
    border: 1px solid #1e293b;
}
.mode-btn {
    flex: 1;
    background: transparent;
    color: #94a3b8;
    border: none;
    padding: 8px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
    transition: 0.2s;
}
.mode-btn.active {
    background: #22c55e;
    color: #0b0f19;
}
/* فلاتر الوقت الأفقية (Tout, 15 Drive, 30 min...) */
.time-filters {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 10px;
    scrollbar-width: none;
}
.time-filters::-webkit-scrollbar {
    display: none;
}
.time-pill {
    background: #1e293b;
    color: #94a3b8;
    border: none;
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 12px;
    white-space: nowrap;
    cursor: pointer;
    font-weight: bold;
}
.time-pill.active {
    background: #22c55e;
    color: #0b0f19;
}
/* شريط البحث */
.search-box {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #131b2e;
    color: #f8fafc;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 13px;
}
/* قائمة الدوريات بتصميم التطبيق الاحترافي */
.league-item {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: 0.2s;
}
.league-item:hover {
    border-color: #38bdf850;
}
.league-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: bold;
    color: #f8fafc;
}
.league-meta {
    display: flex;
    align-items: center;
    gap: 10px;
}
.match-count {
    background: #1e293b;
    color: #94a3b8;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: bold;
}
.fav-star {
    font-size: 16px;
    color: #22c55e;
    cursor: pointer;
}
/* شريط التنقل السفلي الثابت (Bottom Nav) */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 1000;
}
.nav-item {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 2px;
    width: auto;
    padding: 0;
    margin: 0;
}
.nav-item.active {
    color: #22c55e;
    font-weight: bold;
}
.nav-item span.icon {
    font-size: 18px;
}
/* بطاقة المباراة والتوقعات */
.match-card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-left: 4px solid #22c55e;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 13px;
}
.match-card.live {
    border-left-color: #ef4444;
}
.ai-prediction {
    margin-top: 8px;
    padding: 8px;
    background: #0f172a;
    border: 1px dashed #38bdf8;
    border-radius: 6px;
    font-size: 11px;
    color: #38bdf8;
}
</style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <h2>Championnats ⚽</h2>
        <span id="connectionStar" class="status-star" title="حالة الاتصال">🔴</span>
    </div>

    <!-- تبديل مباشر / قبل المباراة -->
    <div class="mode-toggle">
        <button class="mode-btn" onclick="setMode('live', this)">EN DIRECT</button>
        <button class="mode-btn active" onclick="setMode('upcoming', this)">Avant-match</button>
    </div>

    <!-- فلاتر الوقت الأفقية -->
    <div class="time-filters">
        <button class="time-pill active" onclick="filterByTime('all', this)">Tout</button>
        <button class="time-pill" onclick="filterByTime('15', this)">15 Min</button>
        <button class="time-pill" onclick="filterByTime('30', this)">30 minutes</button>
        <button class="time-pill" onclick="filterByTime('60', this)">1 heure</button>
        <button class="time-pill" onclick="filterByTime('120', this)">2 heures</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن دوري أو بلد أو فريق..." onkeyup="filterData()">

    <!-- منطقة عرض المحتوى (الدوريات أو المباريات) -->
    <div id="output">
        <div style="text-align: center; color: #94a3b8; padding: 20px;">جاري تحميل القائمة بتصميم التطبيق...</div>
    </div>
</div>

<!-- شريط التنقل السفلي الثابت -->
<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('popular', this)">
        <span class="icon">🔥</span> Populaire
    </button>
    <button class="nav-item" onclick="switchTab('favorites', this)">
        <span class="icon">⭐</span> Favoris
    </button>
    <button class="nav-item" onclick="switchTab('coupon', this)">
        <span class="icon">🎟️</span> Coupon
    </button>
    <button class="nav-item" onclick="switchTab('history', this)">
        <span class="icon">⏰</span> Historique
    </button>
    <button class="nav-item" onclick="switchTab('menu', this)">
        <span class="icon">📂</span> Menu
    </button>
</div>

<script>
let allMatches = [];
let currentMode = 'upcoming';
let currentTimeFilter = 'all';

function setConnectionStatus(isConnected) {
    const star = document.getElementById('connectionStar');
    if (isConnected) {
        star.innerHTML = "🟢";
        star.title = "متصل بالمنصة بنجاح";
    } else {
        star.innerHTML = "🔴";
        star.title = "منقطع أو تعذر الاتصال";
    }
}

async function loadData() {
    try {
        const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("خطأ في جلب البيانات");
        const data = await response.json();
        
        allMatches = Array.isArray(data) ? data : (data.response || []);
        setConnectionStatus(true);
        renderLeaguesList(allMatches);
    } catch (err) {
        setConnectionStatus(false);
        document.getElementById('output').innerHTML = `
            <div style="background: #ef444420; border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; text-align: center; font-size: 12px;">
                ⚠️ تعذر الاتصال بالمنصة: ${err.message}
            </div>
        `;
    }
}

// تجميع المباريات حسب الدوريات وعرضها بطريقة شبيهة بالصور
function renderLeaguesList(matches) {
    const output = document.getElementById('output');
    
    // تجميع المباريات حسب الدوري
    let leaguesMap = {};
    matches.forEach(item => {
        let leagueName = item.league && item.league.name ? item.league.name : "بطولة أخرى";
        let country = item.league && item.league.country ? item.league.country : "عالمي";
        let key = `${country} - ${leagueName}`;
        
        if (!leaguesMap[key]) {
            leaguesMap[key] = { country: country, name: leagueName, count: 0, matches: [] };
        }
        leaguesMap[key].count++;
        leaguesMap[key].matches.push(item);
    });

    let keys = Object.keys(leaguesMap);
    if (keys.length === 0) {
        output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 20px;">لا توجد بطولات متاحة حالياً.</div>`;
        return;
    }

    let html = "";
    keys.forEach(k => {
        let league = leaguesMap[k];
        html += `
            <div class="league-item" onclick='showLeagueMatches(${JSON.stringify(league.name)})'>
                <div class="league-info">
                    <span>⚽</span>
                    <span>${league.country} : ${league.name}</span>
                </div>
                <div class="league-meta">
                    <span class="match-count">${league.count}</span>
                    <span class="fav-star" onclick="event.stopPropagation(); alert('تمت الإضافة للمفضلة ⭐');">⭐</span>
                </div>
            </div>
        `;
    });
    output.innerHTML = html;
}

function showLeagueMatches(leagueName) {
    let filtered = allMatches.filter(i => (i.league && i.league.name === leagueName));
    const output = document.getElementById('output');
    
    let html = `<button onclick="loadData()" style="background:#1e293b; color:#38bdf8; border:none; padding:8px 12px; border-radius:8px; margin-bottom:10px; cursor:pointer;">⬅ العودة لقائمة الدوريات</button>`;
    
    filtered.forEach(item => {
        let home = item.teams && item.teams.home ? item.teams.home.name : "مضيف";
        let away = item.teams && item.teams.away ? item.teams.away.name : "ضيف";
        let status = item.fixture && item.fixture.status ? item.fixture.status.short : "NS";
        let timeStr = item.fixture && item.fixture.date ? new Date(item.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "";
        
        html += `
            <div class="match-card">
                <span style="color:#38bdf8; font-weight:bold;">🏟️ ${home} vs ${away}</span><br>
                <span style="color:#94a3b8; font-size:11px;">⏰ التوقيت: ${timeStr} | الحالة: ${status}</span>
                <div class="ai-prediction">
                    🤖 تحليل الذكاء الاصطناعي: فرصة عالية لتسجيل الأهداف في هذا اللقاء بين ${home} و ${away}.
                </div>
            </div>
        `;
    });
    output.html = html;
    output.innerHTML = html;
}

function setMode(mode, btn) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function filterByTime(timeVal, btn) {
    currentTimeFilter = timeVal;
    document.querySelectorAll('.time-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
}

function filterData() {
    let q = document.getElementById('searchInput').value.toLowerCase();
    let filtered = allMatches.filter(i => {
        let lName = i.league && i.league.name ? i.league.name.toLowerCase() : "";
        let cName = i.league && i.league.country ? i.league.country.toLowerCase() : "";
        let hTeam = i.teams && i.teams.home ? i.teams.home.name.toLowerCase() : "";
        let aTeam = i.teams && i.teams.away ? i.teams.away.name.toLowerCase() : "";
        return lName.includes(q) || cName.includes(q) || hTeam.includes(q) || aTeam.includes(q);
    });
    renderLeaguesList(filtered);
}

function switchTab(tabName, btn) {
    document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if(tabName === 'popular') {
        renderLeaguesList(allMatches);
    } else if(tabName === 'favorites') {
        document.getElementById('output').innerHTML = `<div style="text-align:center; color:#94a3b8; padding:30px;">⭐ قائمة الدوريات المفضلة فارغة حالياً.</div>`;
    } else {
        document.getElementById('output').innerHTML = `<div style="text-align:center; color:#38bdf8; padding:30px;">قسم (${tabName}) جاهز وقيد التشغيل الشامل.</div>`;
    }
}

window.onload = loadData;
</script>

</body>
</html>
