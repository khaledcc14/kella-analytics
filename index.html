<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - التحليل الرياضي الذكي</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --gold-primary: #d4af37;
            --text-color: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--gold-primary);
        }
        .logo-area h1 {
            margin: 0;
            font-size: 20px;
            color: var(--gold-primary);
        }
        .sound-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold-primary);
            color: var(--gold-primary);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
        }
        .sound-btn:hover {
            background: var(--gold-primary);
            color: var(--bg-color);
        }
        .main-container {
            padding: 20px;
            max-width: 900px;
            margin: auto;
        }
        /* قسم الرياضات والخلايا */
        .sports-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .sport-chip {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            white-space: nowrap;
            transition: 0.2s;
        }
        .sport-chip.active, .sport-chip:hover {
            border-color: var(--gold-primary);
            color: var(--gold-primary);
        }
        .cells-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }
        .cell-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
        }
        .cell-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: var(--text-muted);
        }
        .match-teams {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            color: var(--text-color);
        }
        .analysis-box {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            border-right: 3px solid var(--gold-primary);
        }
    </style>
</head>
<body>

    <!-- الهيدر الأصلي مع زر الموسيقى المدمج -->
    <header>
        <div class="logo-area">
            <h1>KELLA Analytics Pro ⚽</h1>
        </div>
        <button id="sound-toggle-btn" class="sound-btn" onclick="toggleMusic()">
            🔇 تشغيل الموسيقى
        </button>
    </header>

    <!-- محتوى التطبيق والخلايا الرياضية الأصلية -->
    <div class="main-container">
        
        <!-- قائمة الرياضات -->
        <div class="sports-nav">
            <div class="sport-chip active">⚽ كرة القدم</div>
            <div class="sport-chip">🏀 كرة السلة</div>
            <div class="sport-chip">🎾 التنس</div>
        </div>

        <!-- خلايا المباريات والتحليلات -->
        <div class="cells-grid">
            
            <!-- الخلية الأولى -->
            <div class="cell-card">
                <div class="cell-header">
                    <span>الدوري الأوروبي</span>
                    <span style="color: #2ea043;">● مباشر</span>
                </div>
                <div class="match-teams">Real Madrid vs Barcelona</div>
                <div class="analysis-box">
                    نسبة الاحتمالية للفوز: <strong>65%</strong><br>
                    قراءة المخاطر: منخفضة
                </div>
            </div>

            <!-- الخلية الثانية -->
            <div class="cell-card">
                <div class="cell-header">
                    <span>دوري أبطال أوروبا</span>
                    <span style="color: #8b949e;">مترقبة</span>
                </div>
                <div class="match-teams">PSG vs Bayern Munich</div>
                <div class="analysis-box">
                    نسبة الاحتمالية للفوز: <strong>50%</strong><br>
                    قراءة المخاطر: متوسطة
                </div>
            </div>

        </div>

    </div>

    <!-- عنصر الصوت في الخلفية (يقرأ من background.mp3 الخارجي) -->
    <audio id="bg-music" loop preload="auto">
        <source src="background.mp3" type="audio/mpeg">
        متصفحك لا يدعم تشغيل الملفات الصوتية.
    </audio>

    <!-- سكريبت تشغيل الموسيقى -->
    <script>
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('sound-toggle-btn');
            
            if (music.paused) {
                music.play().then(() => {
                    btn.innerHTML = '🎵 إيقاف الموسيقى';
                }).catch(error => {
                    console.log("التشغيل يتطلب تفاعل المستخدم:", error);
                });
            } else {
                music.pause();
                btn.innerHTML = '🔇 تشغيل الموسيقى';
            }
        }
    </script>

</body>
</html>
