<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro - Engine</title>
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    padding: 15px;
    margin: 0;
}
.card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 15px;
    max-width: 480px;
    margin: 0 auto;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
h2 {
    color: #38bdf8;
    text-align: center;
    font-size: 20px;
    margin-top: 0;
}
.subtitle {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 15px;
}
button {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 15px;
}
.match-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-left: 4px solid #38bdf8;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
}
</style>
</head>
<body>

<div class="card">
<h2>KELLA Analytics Pro ⚽</h2>
<div class="subtitle">Live Global Engine - Khaled</div>

<button onclick="loadLiveScores()">⚡ جلب المباريات الحية والنتائج الرسمية</button>
<div id="output" style="text-align: center; color: #94a3b8; font-size: 13px; padding: 10px;">انقر الزر لتحميل البيانات المباشرة...</div>
</div>

<script>
async function loadLiveScores() {
    const output = document.getElementById('output');
    output.innerHTML = "جاري الاتصال بقاعدة البيانات الحية...";

    try {
        // استخدام مصدر مباشر ومفتوح لجدول المباريات الحية والنتائج لليوم
        const response = await fetch('https://raw.githubusercontent.com/openfootball/football.json/master/2026/en.1.json');
        
        if (!response.ok) throw new Error("تعذر الاتصال بقاعدة البيانات.");

        const data = await response.json();
        output.innerHTML = "";

        if (!data.matches || data.matches.length === 0) {
            output.innerHTML = `<div style="color: #f59e0b; text-align: center; padding: 10px;">لا توجد مباريات مسجلة حالياً.</div>`;
            return;
        }

        // عرض المباريات المباشرة والنتائج المسجلة بدقة
        let matchesToShow = data.matches.slice(-5).reverse();
        
        matchesToShow.forEach(match => {
            let team1 = match.team1;
            let team2 = match.team2;
            let score1 = match.score && match.score.ft ? match.score.ft[0] : "-";
            let score2 = match.score && match.score.ft ? match.score.ft[1] : "-";
            let date = match.date;

            output.innerHTML += `
                <div class="match-card">
                    <span style="color:#f59e0b; font-weight:bold;">🏆 الدوري الإنجليزي الممتاز</span><br>
                    🏟️ <b>${team1}</b> vs <b>${team2}</b><br>
                    <span style="color:#38bdf8;">التاريخ: ${date} | النتيجة الرسمية: <b>${score1} - ${score2}</b></span>
                </div>
            `;
        });

    } catch (error) {
        output.innerHTML = `
            <div style="background: #ef444420; border: 1px solid #ef4444; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 12px; text-align: center;">
                ⚠️ تنبيه: ${error.message}
            </div>
        `;
    }
}
</script>

</body>
</html>
