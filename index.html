<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f19">
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    margin: 0;
    padding-bottom: 70px;
}
.app-container {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
}
.top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
}
.top-header h2 {
    color: #38bdf8;
    margin: 0;
    font-size: 18px;
}
.status-star {
    font-size: 20px;
}
.mode-toggle {
    display: flex;
    background: #131b2e;
    border-radius: 25px;
    padding: 4px;
    margin: 10px 0;
    border: 1px solid #1e293b;
}
.mode-btn {
    flex: 1;
    background: transparent;
    color: #94a3b8;
    border: none;
    padding: 8px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
}
.mode-btn.active {
    background: #22c55e;
    color: #0b0f19;
}
.search-box {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #131b2e;
    color: #f8fafc;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 13px;
}
.view-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}
.tab-pill {
    background: #1e293b;
    color: #94a3b8;
    border: none;
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
}
.tab-pill.active {
    background: #38bdf8;
    color: #0b0f19;
}
.league-item {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.league-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    flex-grow: 1;
}
.league-meta {
    display: flex;
    align-items: center;
    gap: 10px;
}
.match-count {
    background: #1e293b;
    color: #94a3b8;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
}
.fav-star {
    font-size: 18px;
    cursor: pointer;
    color: #475569;
}
.fav-star.active {
    color: #eab308;
}
.match-card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
}
.division-title {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 12px;
    font-weight: bold;
}
.scoreboard {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
}
.team-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex: 1;
}
.team-logo {
    width: 35px;
    height: 35px;
    object-fit: contain;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    padding: 2px;
}
.team-name {
    font-size: 11px;
    font-weight: bold;
    color: #f8fafc;
    text-align: center;
    max-width: 80px;
}
.score-block {
    text-align: center;
    min-width: 70px;
}
.score-text {
    font-size: 20px;
    font-weight: bold;
    color: #f8fafc;
    letter-spacing: 2px;
}
.match-time {
    font-size: 10px;
    color: #22c55e;
    margin-top: 4px;
}
.back-btn {
    background: #1e293b;
    color: #38bdf8;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    font-weight: bold;
}
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 1000;
}
.nav-item {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 2px;
}
.nav-item.active {
    color: #22c55e;
    font-weight: bold;
}
.nav-item span.icon {
    font-size: 18px;
}
</style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <h2>KELLA Analytics Pro ⚽</h2>
        <span id="connectionStar" class="status-star">🟢</span>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn" onclick="setMode('live', this)">EN DIRECT</button>
        <button class="mode-btn active" onclick="setMode('upcoming', this)">Avant-match</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن دوري، بلد أو فريق..." onkeyup="filterData()">

    <div class="view-tabs">
        <button id="tabAll" class="tab-pill active" onclick="switchView('all')">🌐 كل الدوريات</button>
        <button id="tabFav" class="tab-pill" onclick="switchView('fav')">⭐ دورياتي المفضلة (<span id="favCount">0</span>)</button>
    </div>

    <div id="output">
        <div style="text-align: center; color: #94a3b8; padding: 20px;">جاري التحميل...</div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('popular', this)"><span class="icon">🔥</span> Populaire</button>
    <button class="nav-item" onclick="switchTab('favorites', this)"><span class="icon">⭐</span> Favoris</button>
    <button class="nav-item" onclick="switchTab('coupon', this)"><span class="icon">🎟️</span> Coupon</button>
    <button class="nav-item" onclick="switchTab('history', this)"><span class="icon">⏰</span> Historique</button>
    <button class="nav-item" onclick="switchTab('menu', this)"><span class="icon">📂</span> Menu</button>
</div>

<script>
let allMatches = [
    {
        league: { name: "La Liga", country: "Spain" },
        teams: { home: { name: "Real Madrid", logo: "" }, away: { name: "Barcelona", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "La Liga", country: "Spain" },
        teams: { home: { name: "Atletico Madrid", logo: "" }, away: { name: "Sevilla", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "UEFA Champions League", country: "World" },
        teams: { home: { name: "Manchester City", logo: "" }, away: { name: "Bayern Munich", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "Ligue 1", country: "France" },
        teams: { home: { name: "Paris Saint-Germain", logo: "" }, away: { name: "Marseille", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "Bundesliga", country: "Germany" },
        teams: { home: { name: "Borussia Dortmund", logo: "" }, away: { name: "RB Leipzig", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "Serie A", country: "Italy" },
        teams: { home: { name: "Juventus", logo: "" }, away: { name: "Inter Milan", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "Premier League", country: "England" },
        teams: { home: { name: "Arsenal", logo: "" }, away: { name: "Liverpool", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "Saudi Professional League", country: "Saudi Arabia" },
        teams: { home: { name: "Al Hilal", logo: "" }, away: { name: "Al Nassr", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    },
    {
        league: { name: "Süper Lig", country: "Turkey" },
        teams: { home: { name: "Galatasaray", logo: "" }, away: { name: "Fenerbahce", logo: "" } },
        goals: { home: null, away: null },
        fixture: { status: { short: "NS" }, date: new Date().toISOString() }
    }
];

let leaguesMapCache = {};
let defaultFavLeagues = [
    "La Liga", "UEFA Champions League", "Ligue 1", 
    "Bundesliga", "Serie A", "Premier League", 
    "Saudi Professional League", "Primeira Liga", "Süper Lig"
];

let storedFavs = JSON.parse(localStorage.getItem('kella_fav_leagues'));
if (!storedFavs) {
    storedFavs = defaultFavLeagues;
    localStorage.setItem('kella_fav_leagues', JSON.stringify(storedFavs));
}
let favoriteLeagues = storedFavs;
let currentViewMode = 'all';

function initApp() {
    try {
        leaguesMapCache = {};
        allMatches.forEach(item => {
            let leagueName = item.league?.name || "بطولة أخرى";
            let country = item.league?.country || "عالمي";
            let key = `${country} - ${leagueName}`;
            
            if (!leaguesMapCache[key]) {
                leaguesMapCache[key] = { country: country, name: leagueName, count: 0 };
            }
            leaguesMapCache[key].count++;
        });

        updateFavCount();
        renderLeaguesList();
    } catch (e) {
        document.getElementById('output').innerHTML = `<div style="text-align:center; color:#fca5a5; padding:20px;">خطأ في تحميل الواجهة</div>`;
    }
}

function switchView(mode) {
    currentViewMode = mode;
    document.getElementById('tabAll').classList.toggle('active', mode === 'all');
    document.getElementById('tabFav').classList.toggle('active', mode === 'fav');
    renderLeaguesList();
}

function toggleFavorite(leagueName, event) {
    event.stopPropagation();
    if (favoriteLeagues.includes(leagueName)) {
        favoriteLeagues = favoriteLeagues.filter(l => l !== leagueName);
    } else {
        favoriteLeagues.push(leagueName);
    }
    localStorage.setItem('kella_fav_leagues', JSON.stringify(favoriteLeagues));
    updateFavCount();
    renderLeaguesList();
}

function updateFavCount() {
    document.getElementById('favCount').innerText = favoriteLeagues.length;
}

function renderLeaguesList() {
    const output = document.getElementById('output');
    let q = document.getElementById('searchInput').value.toLowerCase();
    
    let keys = Object.keys(leaguesMapCache);
    let html = "";
    let displayedCount = 0;

    keys.forEach(k => {
        let l = leaguesMapCache[k];
        
        if (currentViewMode === 'fav' && !favoriteLeagues.includes(l.name)) return;
        if (q && !k.toLowerCase().includes(q)) return;

        displayedCount++;
        let isFav = favoriteLeagues.includes(l.name);
        let starClass = isFav ? "fav-star active" : "fav-star";
        let safeName = l.name.replace(/"/g, '&quot;');

        html += `
            <div class="league-item">
                <div class="league-info" onclick='showLeagueMatches("${safeName}")'>
                    <span>⚽</span>
                    <span>${l.country} : ${l.name}</span>
                </div>
                <div class="league-meta">
                    <span class="match-count">${l.count}</span>
                    <span class="${starClass}" onclick='toggleFavorite("${safeName}", event)'>⭐</span>
                </div>
            </div>
        `;
    });

    if (displayedCount === 0) {
        output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px; font-size:13px;">لا توجد دوريات مطابقة.</div>`;
        return;
    }

    output.innerHTML = html;
}

function showLeagueMatches(leagueName) {
    try {
        let filtered = allMatches.filter(i => (i.league?.name === leagueName));
        const output = document.getElementById('output');
        
        let html = `<button class="back-btn" onclick="switchView(currentViewMode)">⬅ العودة للقائمة</button>`;
        
        filtered.forEach((item) => {
            let home = item.teams?.home?.name || "مضيف";
            let away = item.teams?.away?.name || "ضيف";
            
            let hGoals = item.goals?.home ?? "-";
            let aGoals = item.goals?.away ?? "-";
            let scoreDisplay = (hGoals === "-" && aGoals === "-") ? "VS" : `${hGoals} : ${aGoals}`;
            
            let division = `Football . ${item.league?.country || 'World'} . ${item.league?.name || 'League'}`;
            
            html += `
                <div class="match-card">
                    <div class="division-title">🏆 ${division}</div>
                    <div class="scoreboard">
                        <div class="team-block">
                            <span style="font-size:24px;">⚽</span>
                            <span class="team-name">${home}</span>
                        </div>
                        <div class="score-block">
                            <div class="score-text">${scoreDisplay}</div>
                            <div class="match-time">قريباً</div>
                        </div>
                        <div class="team-block">
                            <span style="font-size:24px;">⚽</span>
                            <span class="team-name">${away}</span>
                        </div>
                    </div>
                </div>
            `;
        });
        output.innerHTML = html;
    } catch (err) {
        document.getElementById('output').innerHTML = `<button class="back-btn" onclick="switchView(currentViewMode)">⬅ العودة للقائمة</button><div style="text-align:center; color:#fca5a5; padding:20px;">عذراً، حدث خطأ بسيط في عرض المباريات.</div>`;
    }
}

function setMode(m, b) {
    document.querySelectorAll('.mode-btn.active').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
}

function switchTab(tab, b) {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if(tab === 'popular') {
        renderLeaguesList();
    } else {
        document.getElementById('output').innerHTML = `<div style="text-align:center; color:#38bdf8; padding:30px;">قسم (${tab}) قيد التفعيل.</div>`;
    }
}

function filterData() {
    renderLeaguesList();
}

window.onload = initApp;
</script>

</body>
</html>
