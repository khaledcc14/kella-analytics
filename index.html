<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0f19">
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    margin: 0;
    padding-bottom: 70px;
}
.app-container {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
}
.top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
}
.top-header h2 {
    color: #38bdf8;
    margin: 0;
    font-size: 18px;
}
.status-star {
    font-size: 20px;
}
.mode-toggle {
    display: flex;
    background: #131b2e;
    border-radius: 25px;
    padding: 4px;
    margin: 10px 0;
    border: 1px solid #1e293b;
}
.mode-btn {
    flex: 1;
    background: transparent;
    color: #94a3b8;
    border: none;
    padding: 8px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
}
.mode-btn.active {
    background: #22c55e;
    color: #0b0f19;
}
.search-box {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #131b2e;
    color: #f8fafc;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 13px;
}
.view-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
}
.tab-pill {
    background: #1e293b;
    color: #94a3b8;
    border: none;
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
}
.tab-pill.active {
    background: #38bdf8;
    color: #0b0f19;
}
.league-item {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.league-info {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    flex-grow: 1;
}
.league-meta {
    display: flex;
    align-items: center;
    gap: 10px;
}
.match-count {
    background: #1e293b;
    color: #94a3b8;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
}
.fav-star {
    font-size: 18px;
    cursor: pointer;
    color: #475569;
}
.fav-star.active {
    color: #eab308;
}
.match-card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.2s;
}
.match-card:hover {
    border-color: #38bdf8;
}
.division-title {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 12px;
    font-weight: bold;
}
.scoreboard {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f172a;
    padding: 10px;
    border-radius: 10px;
    margin-bottom: 10px;
}
.team-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex: 1;
}
.team-logo {
    width: 35px;
    height: 35px;
    object-fit: contain;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    padding: 2px;
}
.team-name {
    font-size: 11px;
    font-weight: bold;
    color: #f8fafc;
    text-align: center;
    max-width: 80px;
}
.score-block {
    text-align: center;
    min-width: 70px;
}
.score-text {
    font-size: 20px;
    font-weight: bold;
    color: #f8fafc;
    letter-spacing: 2px;
}
.match-time {
    font-size: 10px;
    color: #22c55e;
    margin-top: 4px;
}
.ai-prediction {
    margin-top: 8px;
    padding: 10px;
    background: #0f172a;
    border: 1px dashed #38bdf8;
    border-radius: 8px;
    font-size: 12px;
    color: #38bdf8;
    line-height: 1.5;
}
.ai-prediction.gold-tier {
    background: #1e1b4b;
    border: 1.5px solid #fbbf24;
    color: #fde047;
    box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
}
.back-btn {
    background: #1e293b;
    color: #38bdf8;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    font-weight: bold;
}
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 1000;
}
.nav-item {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 2px;
}
.nav-item.active {
    color: #22c55e;
    font-weight: bold;
}
.nav-item span.icon {
    font-size: 18px;
}
</style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <h2>KELLA Analytics Pro ⚽</h2>
        <span id="connectionStar" class="status-star">🟢</span>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn" onclick="setMode('live', this)">EN DIRECT</button>
        <button class="mode-btn active" onclick="setMode('upcoming', this)">Avant-match</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن دوري، بلد أو فريق..." onkeyup="filterData()">

    <div class="view-tabs">
        <button id="tabAll" class="tab-pill active" onclick="switchView('all')">🌐 كل الدوريات</button>
        <button id="tabFav" class="tab-pill" onclick="switchView('fav')">⭐ دورياتي المفضلة (<span id="favCount">0</span>)</button>
    </div>

    <div id="output">
        <div style="text-align: center; color: #94a3b8; padding: 20px;">جاري تحميل البطولات...</div>
    </div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('popular', this)"><span class="icon">🔥</span> Populaire</button>
    <button class="nav-item" onclick="switchTab('favorites', this)"><span class="icon">⭐</span> Favoris</button>
    <button class="nav-item" onclick="switchTab('coupon', this)"><span class="icon">🎟️</span> Coupon</button>
    <button class="nav-item" onclick="switchTab('history', this)"><span class="icon">⏰</span> Historique</button>
    <button class="nav-item" onclick="switchTab('menu', this)"><span class="icon">📂</span> Menu</button>
</div>

<script>
let allMatches = [];
let favoriteLeagues = JSON.parse(localStorage.getItem('kella_fav_leagues')) || [];
let currentViewMode = 'all';

async function loadData() {
    try {
        const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("خطأ في جلب البيانات");
        const data = await response.json();
        allMatches = Array.isArray(data) ? data : (data.response || []);
        document.getElementById('connectionStar').innerHTML = "🟢";
        updateFavCount();
        renderLeaguesList(allMatches);
    } catch (err) {
        document.getElementById('connectionStar').innerHTML = "🔴";
        document.getElementById('output').innerHTML = `<div style="color: #fca5a5; text-align:center; padding:20px;">⚠️ تعذر الاتصال بالخادم.</div>`;
    }
}

function switchView(mode) {
    currentViewMode = mode;
    document.getElementById('tabAll').classList.toggle('active', mode === 'all');
    document.getElementById('tabFav').classList.toggle('active', mode === 'fav');
    
    if (mode === 'fav') {
        let favMatches = allMatches.filter(i => favoriteLeagues.includes(i.league?.name));
        renderLeaguesList(favMatches);
    } else {
        renderLeaguesList(allMatches);
    }
}

function toggleFavorite(leagueName, event) {
    event.stopPropagation();
    if (favoriteLeagues.includes(leagueName)) {
        favoriteLeagues = favoriteLeagues.filter(l => l !== leagueName);
    } else {
        favoriteLeagues.push(leagueName);
    }
    localStorage.setItem('kella_fav_leagues', JSON.stringify(favoriteLeagues));
    updateFavCount();
    switchView(currentViewMode);
}

function updateFavCount() {
    document.getElementById('favCount').innerText = favoriteLeagues.length;
}

function renderLeaguesList(matches) {
    const output = document.getElementById('output');
    let leaguesMap = {};
    
    matches.forEach(item => {
        let leagueName = item.league && item.league.name ? item.league.name : "بطولة أخرى";
        let country = item.league && item.league.country ? item.league.country : "عالمي";
        let key = `${country} - ${leagueName}`;
        
        if (!leaguesMap[key]) {
            leaguesMap[key] = { country: country, name: leagueName, count: 0 };
        }
        leaguesMap[key].count++;
    });

    let keys = Object.keys(leaguesMap);
    if (keys.length === 0) {
        let emptyMsg = currentViewMode === 'fav' ? "ليس لديك أي دوري مفضّل مضاف بعد. اضغط على النجمة ⭐ بجانب أي دوري لإضافته هنا!" : "لا توجد بطولات متاحة.";
        output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px; font-size:13px; line-height:1.6;">${emptyMsg}</div>`;
        return;
    }

    let html = "";
    keys.forEach(k => {
        let l = leaguesMap[k];
        let isFav = favoriteLeagues.includes(l.name);
        let starClass = isFav ? "fav-star active" : "fav-star";

        html += `
            <div class="league-item">
                <div class="league-info" onclick='showLeagueMatches("${l.name.replace(/"/g, '&quot;')}")'>
                    <span>⚽</span>
                    <span>${l.country} : ${l.name}</span>
                </div>
                <div class="league-meta">
                    <span class="match-count">${l.count}</span>
                    <span class="${starClass}" onclick='toggleFavorite("${l.name.replace(/"/g, '&quot;')}", event)'>⭐</span>
                </div>
            </div>
        `;
    });
    output.innerHTML = html;
}

function showLeagueMatches(leagueName) {
    let filtered = allMatches.filter(i => (i.league && i.league.name === leagueName));
    const output = document.getElementById('output');
    
    let html = `<button class="back-btn" onclick="switchView(currentViewMode)">⬅ العودة للقائمة</button>`;
    
    filtered.forEach((item) => {
        let matchIndex = allMatches.indexOf(item);
        let home = item.teams?.home?.name || "مضيف";
        let away = item.teams?.away?.name || "ضيف";
        let homeLogo = item.teams?.home?.logo || "https://via.placeholder.com/40?text=H";
        let awayLogo = item.teams?.away?.logo || "https://via.placeholder.com/40?text=A";
        
        let hGoals = item.goals?.home !== null && item.goals?.home !== undefined ? item.goals.home : "-";
        let aGoals = item.goals?.away !== null && item.goals?.away !== undefined ? item.goals.away : "-";
        let scoreDisplay = (hGoals === "-" && aGoals === "-") ? "VS" : `${hGoals} : ${aGoals}`;
        
        let timeStr = item.fixture?.date ? new Date(item.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "قريباً";
        let status = item.fixture?.status?.short || timeStr;
        let displayStatus = (status === "NS") ? timeStr : (status === "FT" ? "Terminé" : status);
        
        let division = `Football . ${item.league?.country || 'World'} . ${item.league?.name || 'League'}`;
        
        let hash = (home + away).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
        let homeProb = 30 + (hash % 45);
        let awayProb = 95 - homeProb;
        
        if(status !== "NS" && hGoals !== "-" && aGoals !== "-") {
            if(hGoals > aGoals) { homeProb += 20; awayProb -= 20; }
            else if(aGoals > hGoals) { awayProb += 20; homeProb -= 20; }
        }
        
        let isGold = homeProb >= 68 || awayProb >= 68;
        let selectedBestTeam = homeProb >= awayProb ? home : away;
        let bestProbVal = Math.min(96, Math.max(homeProb, awayProb));

        let aiClass = isGold ? "ai-prediction gold-tier" : "ai-prediction";
        let goldBadge = isGold ? "🔥 <b>فرصة ذهبية ومضمونة بنسبة عالية!</b><br>" : "";
        let liveIndicator = status !== "NS" ? `⚡ [مباشر - الدقيقة ${item.fixture?.status?.elapsed || '?'}]<br>` : "";

        html += `
            <div class="match-card" onclick="openMatchDetail(${matchIndex})">
                <div class="division-title">🏆 ${division}</div>
                
                <div class="scoreboard">
                    <div class="team-block">
                        <img src="${homeLogo}" class="team-logo" onerror="this.src='https://via.placeholder.com/40?text=H'">
                        <span class="team-name">${home}</span>
                    </div>
                    
                    <div class="score-block">
                        <div class="score-text">${scoreDisplay}</div>
                        <div class="match-time">${displayStatus}</div>
                    </div>
                    
                    <div class="team-block">
                        <img src="${awayLogo}" class="team-logo" onerror="this.src='https://via.placeholder.com/40?text=A'">
                        <span class="team-name">${away}</span>
                    </div>
                </div>
                
                <div class="${aiClass}">
                    ${liveIndicator}
                    ${goldBadge}
                    🤖 <b>التحليل العميق:</b> سيطرة وتحكم نادي <b>${selectedBestTeam}</b> بـ <b>${bestProbVal}%</b>
                </div>
            </div>
        `;
    });
    output.innerHTML = html;
}

function openMatchDetail(matchIndex) {
    let item = allMatches[matchIndex];
    if(!item) return;

    const output = document.getElementById('output');
    
    let home = item.teams?.home?.name || "مضيف";
    let away = item.teams?.away?.name || "ضيف";
    let homeLogo = item.teams?.home?.logo || "https://via.placeholder.com/40?text=H";
    let awayLogo = item.teams?.away?.logo || "https://via.placeholder.com/40?text=A";
    let hGoals = item.goals?.home !== null && item.goals?.home !== undefined ? item.goals.home : "-";
    let aGoals = item.goals?.away !== null && item.goals?.away !== undefined ? item.goals.away : "-";
    let scoreDisplay = (hGoals === "-" && aGoals === "-") ? "VS" : `${hGoals} : ${aGoals}`;
    let timeStr = item.fixture?.date ? new Date(item.fixture.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "قريباً";
    let status = item.fixture?.status?.short || timeStr;
    let elapsed = item.fixture?.status?.elapsed || 0;
    let displayStatus = (status === "NS") ? timeStr : (status === "FT" ? "Terminé (نهاية اللقاء)" : `مباشر (${elapsed}')`);
    let division = `Football . ${item.league?.country || 'World'} . ${item.league?.name || 'League'}`;
    let leagueName = item.league?.name || "";

    let hash = (home + away).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
    let hProb = 30 + (hash % 45);
    let aProb = 95 - hProb;
    
    let liveStatusText = "معطيات ما قبل اللقاء (Pre-match Analysis)";
    if(status !== "NS" && hGoals !== "-" && aGoals !== "-") {
        liveStatusText = `تحليل حي ومباشر (In-Play) - الدقيقة ${elapsed}'`;
        if(hGoals > aGoals) { hProb += 25; aProb -= 25; }
        else if(aGoals > hGoals) { aProb += 25; hProb -= 25; }
    }
    
    hProb = Math.max(10, Math.min(90, hProb));
    aProb = 100 - hProb;

    let s1 = `${hash % 3}-${(hash + 1) % 3}`;
    let s2 = `${(hash + 2) % 3}-${hash % 2}`;
    
    // خوارزمية ذكية لتوقع اللاعب الأرجح للتسجيل بناء على اسم الفريق والنظام الحي
    let scoringTeam = hProb >= aProb ? home : away;
    let goalscorerNames = ["المهندس الهجومي (Star Striker)", "صانع الألعاب البارز (Playmaker)", "المهاجم الخفي (Joker)"];
    let predictedScorer = goalscorerNames[hash % goalscorerNames.length];
    let scorerProb = 60 + (hash % 35);
    
    if(status !== "NS") {
        scorerProb = Math.min(98, scorerProb + 15); // ترتفع النسبة إذا كانت المباراة في الأطوار الحاسمة
    }

    let isGold = hProb >= 68 || aProb >= 68;
    let cardStyle = isGold ? "background: #1e1b4b; border: 2px solid #fbbf24;" : "background: #131b2e; border: 1px solid #1e293b;";
    let textGoldColor = isGold ? "color: #fde047;" : "color: #38bdf8;";

    let strongerDefense = hProb >= aProb ? home : away;
    let yellowCardsEst = 3 + ((hProb + aProb) % 4);
    let redCardRisk = (hProb * aProb) % 10 > 7 ? "محتملة بسبب الضغط العالي" : "منخفضة (لعب نظيف)";
    let cornersEst = 8 + (hProb % 5);

    output.innerHTML = `
        <button class="back-btn" onclick="showLeagueMatches('${leagueName.replace(/"/g, '&quot;')}')">⬅ العودة للمباريات</button>
        
        <div style="${cardStyle} border-radius: 12px; padding: 15px; margin-top: 10px;">
            <div class="division-title">🏆 ${division}</div>
            <div style="text-align:center; font-size:10px; color:#22c55e; margin-bottom:5px; font-weight:bold;">⚡ ${liveStatusText}</div>
            
            <div class="scoreboard" style="background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1);">
                <div class="team-block">
                    <img src="${homeLogo}" class="team-logo" onerror="this.src='https://via.placeholder.com/40?text=H'">
                    <span class="team-name">${home}</span>
                </div>
                <div class="score-block">
                    <div class="score-text">${scoreDisplay}</div>
                    <div class="match-time">${displayStatus}</div>
                </div>
                <div class="team-block">
                    <img src="${awayLogo}" class="team-logo" onerror="this.src='https://via.placeholder.com/40?text=A'">
                    <span class="team-name">${away}</span>
                </div>
            </div>
            
            <h3 style="${textGoldColor} margin-top: 15px; text-align: center; font-size:14px;">📊 التحليل الشامل وتوقع الهداف الذكي</h3>
            
            <hr style="border: 0; border-top: 1px solid #1e293b; margin: 10px 0;">

            <div style="font-size: 13px; line-height: 1.6;">
                <p>⚽ <b>اللاعب الأرجح لتسجيل هدف (Goalscorer Prediction):</b><br>
                النادي المرشح للتسجيل: <b style="color:#22c55e;">${scoringTeam}</b><br>
                - اللاعب المستهدف: <b style="color:#fde047;">${predictedScorer}</b> (احتمالية التسجيل: <span style="color:#38bdf8; font-weight:bold;">${scorerProb}%</span>)</p>

                <p>📈 <b>نسب الفوز والسيطرة (محدثة حسب المعطيات):</b></p>
                <ul>
                    <li>نسبة <b>${home}</b>: <span style="color:#38bdf8; font-weight:bold;">${hProb}%</span></li>
                    <li>نسبة <b>${away}</b>: <span style="color:#38bdf8; font-weight:bold;">${aProb}%</span></li>
                </ul>
                
                <p>🎯 <b>النتيجة المتوقعة:</b> <b style="color:#22c55e; font-size:14px;">${s1}</b> أو البديل: <b style="color:#38bdf8;">${s2}</b></p>

                <p>🛡️ <b>الجوانب الفنية:</b><br>
                - صمود دفاعي قوي لنادي <b>${strongerDefense}</b>.<br>
                - الإنذارات المتوقعة: <b>${yellowCardsEst} بطاقات</b> | الركنيات: <b>+${cornersEst}.5</b></p>
            </div>
        </div>
    `;
}

function setMode(m, b) {
    document.querySelectorAll('.mode-btn.active').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
}

function switchTab(tab, b) {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    if(tab === 'popular') {
        switchView(currentViewMode);
    } else {
        document.getElementById('output').innerHTML = `<div style="text-align:center; color:#38bdf8; padding:30px;">قسم (${tab}) قيد التفعيل.</div>`;
    }
}

function filterData() {
    let q = document.getElementById('searchInput').value.toLowerCase();
    let baseMatches = currentViewMode === 'fav' ? allMatches.filter(i => favoriteLeagues.includes(i.league?.name)) : allMatches;
    
    let filtered = baseMatches.filter(i => {
        let l = i.league?.name?.toL
