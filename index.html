    <script src="ai-predictor.js"></script>
    <script>
        const aiPredictor = new KellaAIPredictor();
        let currentSelectedDate = '';

        document.addEventListener("DOMContentLoaded", () => {
            buildDateCarousel();
        });

        function buildDateCarousel() {
            const container = document.getElementById('dateTabsContainer');
            container.innerHTML = '';
            const today = new Date();
            
            for (let i = -3; i <= 10; i++) {
                let d = new Date();
                d.setDate(today.getDate() + i);
                let dateStr = d.toISOString().split('T')[0];
                let displayLabel = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                
                if (i === 0) displayLabel = "Aujourd'hui (" + displayLabel + ")";
                else if (i === 1) displayLabel = "Demain (" + displayLabel + ")";

                const tab = document.createElement('div');
                tab.className = `date-tab ${i === 0 ? 'active' : ''}`;
                tab.innerText = displayLabel;
                tab.onclick = () => {
                    document.querySelectorAll('.date-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    loadMatchesForSelectedDate(dateStr);
                };
                container.appendChild(tab);
                if (i === 0) {
                    currentSelectedDate = dateStr;
                    loadMatchesForSelectedDate(dateStr);
                }
            }
        }

        function loadMatchesForSelectedDate(dateStr) {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = `<div class="loading-box">جاري مزامنة وتحليل رهانات تاريخ ${dateStr} بالذكاء الاصطناعي... 🤖📊</div>`;
            setTimeout(() => { renderDynamicMatches(dateStr); }, 400);
        }

        function renderDynamicMatches(date) {
            const container = document.getElementById('matchesContainer');
            const m1 = aiPredictor.generateMatchIntelligence("Manchester City", "Arsenal", "Advanced");
            const m2 = aiPredictor.generateMatchIntelligence("Barcelona", "Real Madrid", "Advanced");
            const m3 = aiPredictor.generateMatchIntelligence("AC Milan", "Inter Milan", "Advanced");

            container.innerHTML = `
                <div style="background: #0f172a; color: white; padding: 6px 15px; font-size: 11px; text-align: center; font-weight: bold;">
                    🎯 مصفوفة تحليل المراهنات والذكاء الاصطناعي - ${date}
                </div>

                <!-- مباراة 1 -->
                <div class="league-box">
                    <div class="league-title"><span>🏴󠁧󠁢󠁥󠁮󠁧󠁿</span><span>Premier League</span></div>
                    <div class="match-row" onclick="openBettingAnalysis('Manchester City', 'Arsenal')">
                        <div class="team-name left">Man City</div>
                        <div class="match-center-info">
                            <span style="font-size: 12px; font-weight: bold; color: #16a34a;">🔥 رهان مضمون</span><br>
                            <span style="font-size: 10px; color: #0284c7; font-weight: bold;">Over 2.5 / BTTS</span>
                        </div>
                        <div class="team-name right">Arsenal</div>
                    </div>
                </div>

                <!-- مباراة 2 -->
                <div class="league-box">
                    <div class="league-title"><span>🇪🇸</span><span>LaLiga</span></div>
                    <div class="match-row" onclick="openBettingAnalysis('Barcelona', 'Real Madrid')">
                        <div class="team-name left">Barcelona</div>
                        <div class="match-center-info">
                            <span style="font-size: 12px; font-weight: bold; color: #16a34a;">🔥 قيمة عالية</span><br>
                            <span style="font-size: 10px; color: #0284c7; font-weight: bold;">1X & BTTS</span>
                        </div>
                        <div class="team-name right">Real Madrid</div>
                    </div>
                </div>

                <!-- مباراة 3 -->
                <div class="league-box">
                    <div class="league-title"><span>🇮🇹</span><span>Serie A</span></div>
                    <div class="match-row" onclick="openBettingAnalysis('AC Milan', 'Inter Milan')">
                        <div class="team-name left">AC Milan</div>
                        <div class="match-center-info">
                            <span style="font-size: 12px; font-weight: bold; color: #16a34a;">🔥 تحليل تكتيكي</span><br>
                            <span style="font-size: 10px; color: #0284c7; font-weight: bold;">Under 3.5 Goals</span>
                        </div>
                        <div class="team-name right">Inter Milan</div>
                    </div>
                </div>
            `;
        }

        // نافذة تحليل المراهنين المتطورة
        function openBettingAnalysis(home, away) {
            const modal = document.getElementById('aiModal');
            document.getElementById('modalMatchTitle').innerText = `${home} vs ${away}`;
            let data = aiPredictor.generateMatchIntelligence(home, away, "Advanced");

            document.getElementById('aiModalBody').innerHTML = `
                <div class="ai-card" style="border-left-color: #16a34a;">
                    <div class="ai-title" style="color: #16a34a;">💰 توصيات المراهنين المحترفين (Value Bets)</div>
                    <div class="stat-row"><span>النتيجة المتوقعة بدقة:</span> <strong style="color: #0284c7;">${data.predictedScore}</strong></div>
                    <div class="stat-row"><span>تسجيل الفريقين (BTTS):</span> <strong style="color: #16a34a;">نعم (نسبة 82%)</strong></div>
                    <div class="stat-row"><span>إجمالي الأهداف (Over/Under):</span> <strong>أكثر من 2.5 هدف</strong></div>
                    <div class="stat-row"><span>الرهان المزدوج الأقوى:</span> <strong>1X (فوز أصحاب الأرض أو تعادل)</strong></div>
                </div>

                <div class="ai-card">
                    <div class="ai-title">📊 النسب الاحتمالية الخام</div>
                    <div class="stat-row"><span>فوز (${home}):</span> <strong>${data.probabilities.home}</strong></div>
                    <div class="stat-row"><span>التعادل (Draw):</span> <strong>${data.probabilities.draw}</strong></div>
                    <div class="stat-row"><span>فوز (${away}):</span> <strong>${data.probabilities.away}</strong></div>
                </div>

                <div style="background: #f0fdf4; padding: 10px; border-radius: 8px; color: #166534; font-size: 12px; border: 1px solid #bbf7d0;">
                    💡 <strong>رأي خبير KELLA للمراهنين:</strong> المباراة تتميز بنسق هجومي عالٍ، والمعطيات الفنية تمنح أفضلية واضحة لتسجيل الأهداف من الجانبين مع ميل طفيف للسيطرة المحلية.
                </div>
            `;

            modal.style.display = 'flex';
        }

        function closeModal(e) {
            if (e.target.id === 'aiModal') {
                e.target.style.display = 'none';
            }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.page-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            document.getElementById(`section-${tabName}`).classList.add('active');
            element.classList.add('active');
        }
    </script>
