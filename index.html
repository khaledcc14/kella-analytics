<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    padding: 15px;
    margin: 0;
}
.card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-radius: 15px;
    max-width: 480px;
    margin: 0 auto;
    padding: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}
h2 {
    color: #38bdf8;
    text-align: center;
    font-size: 20px;
    margin-top: 0;
}
.subtitle {
    text-align: center;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 15px;
}
button {
    background: linear-gradient(135deg, #0284c7, #0369a1);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 12px;
    width: 100%;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 10px;
}
.search-box {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #1e293b;
    background: #0f172a;
    color: #f8fafc;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 13px;
}
.filter-tabs {
    display: flex;
    gap: 5px;
    margin-bottom: 10px;
}
.tab-btn {
    flex: 1;
    background: #1e293b;
    color: #94a3b8;
    border: 1px solid #38bdf820;
    border-radius: 8px;
    padding: 8px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    margin: 0;
}
.tab-btn.active {
    background: #0284c7;
    color: white;
    border-color: #38bdf8;
}
.leagues-container {
    display: flex;
    gap: 5px;
    overflow-x: auto;
    padding-bottom: 5px;
    margin-bottom: 10px;
}
.league-btn {
    background: #1e293b;
    color: #38bdf8;
    border: 1px solid #38bdf840;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 11px;
    white-space: nowrap;
    cursor: pointer;
    transition: 0.2s;
    width: auto;
    margin: 0;
}
.league-btn:hover, .league-btn.active {
    background: #38bdf8;
    color: #0b0f19;
    font-weight: bold;
}
.match-card {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-left: 4px solid #22c55e;
    border-radius: 10px;
    padding: 12px;
    margin-top: 10px;
    font-size: 13px;
    transition: 0.2s;
}
.match-card.live {
    border-left-color: #ef4444;
    animation: pulse 2s infinite;
}
.match-info-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    border-top: 1px solid #1e293b;
    padding-top: 6px;
}
.ai-prediction {
    margin-top: 8px;
    padding: 8px 10px;
    background: #1e293b80;
    border: 1px dashed #38bdf8;
    border-radius: 8px;
    font-size: 11px;
    color: #38bdf8;
    line-height: 1.5;
    word-break: break-word;
}
@keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    70% { box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
    100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
}
</style>
</head>
<body>

<div class="card">
<h2>KELLA Analytics Pro ⚽</h2>
<div class="subtitle">Live Global Engine & AI Predictor - Khaled</div>

<button onclick="loadLiveMatches()">⚡ تحديث وجلب مباريات اليوم</button>
<input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن فريق أو دوري..." onkeyup="filterMatches()">

<!-- أزرار تصفية الحالة (الكل / Live / Next) -->
<div class="filter-tabs">
    <button class="tab-btn active" onclick="setStatusFilter('all', this)">الكل 🌍</button>
    <button class="tab-btn" onclick="setStatusFilter('live', this)">🔴 مباريات مباشرة</button>
    <button class="tab-btn" onclick="setStatusFilter('upcoming', this)">⏰ لم تبدأ بعد</button>
</div>

<!-- أزرار تصفية الدوريات السريعة -->
<div class="leagues-container">
    <button class="league-btn active" onclick="filterByLeague('all', this)">كل الدوريات</button>
    <button class="league-btn" onclick="filterByLeague('Spain', this)">🇪🇸 إسبانيا</button>
    <button class="league-btn" onclick="filterByLeague('France', this)">🇫🇷 فرنسا</button>
    <button class="league-btn" onclick="filterByLeague('Brazil', this)">🇧🇷 البرازيل</button>
    <button class="league-btn" onclick="filterByLeague('Belgium', this)">🇧🇪 بلجيكا</button>
    <button class="league-btn" onclick="filterByLeague('England', this)">🏴󠁧󠁢󠁥󠁮󠁧󠁿 إنجلترا</button>
    <button class="league-btn" onclick="filterByLeague('Italy', this)">🇮🇹 إيطاليا</button>
</div>

<div id="output" style="text-align: center; color: #94a3b8; font-size: 13px; padding: 10px;">جاري تحميل المحرك الذكي...</div>
</div>

<script>
let allMatches = [];
let currentLeagueFilter = 'all';
let currentStatusFilter = 'all';

async function loadLiveMatches() {
    const output = document.getElementById('output');
    output.innerHTML = "جاري تحليل المباريات وجلب توقعات الذكاء الاصطناعي...";

    try {
        const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json?t=' + new Date().getTime());
        if (!response.ok) throw new Error("تعذر جلب قاعدة البيانات.");

        const data = await response.json();
        
        if (Array.isArray(data)) {
            allMatches = data;
        } else if (data && Array.isArray(data.response)) {
            allMatches = data.response;
        } else {
            allMatches = [];
        }

        applyFilters();

    } catch (err) {
        output.innerHTML = `
            <div style="background: #ef444420; border: 1px solid #ef4444; color: #fca5a5; padding: 10px; border-radius: 8px; text-align: center; font-size: 12px;">
                ⚠️ تنبيه: ${err.message}
            </div>
        `;
    }
}

function generateAIPrediction(home, away) {
    let hash = (home + away).split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
    // اقتراح نتيجة رقمية افتراضية واضحة بناءً على خوارزمية الفريقين
    let scoreH = hash % 3;
    let scoreA = (hash + 1) % 3;
    
    let options = [
        `🤖 <b>التوقعات والنتيجة:</b> فوز محتمل لـ ${home} (${scoreH}-${scoreA}) مع نسبة سيطرة 58% وتسجيل أهداف من الطرفين.`,
        `🤖 <b>التوقعات والنتيجة:</b> تعادل إيجابي أو فوز صعب لـ ${away} بنتيجة (${scoreH}-${scoreA + 1})، لقاء متكافئ تكتيكياً.`,
        `🤖 <b>التوقعات والنتيجة:</b> سيطرة مرتقبة لـ ${home} وتوقع تسجيل أكثر من هدفين لتنتهي (${scoreH + 1}-${scoreA}).`,
        `🤖 <b>التوقعات والنتيجة:</b> حذر دفاعي وانتهائها على وقع تعادل سلبي أو هدف يتيم (${scoreH}-${scoreA}).`
    ];
    return options[hash % options.length];
}

function displayMatches(matches) {
    const output = document.getElementById('output');
    output.innerHTML = "";

    if (matches.length === 0) {
        output.innerHTML = `<div style="color: #f59e0b; text-align: center; padding: 15px;">لا توجد مباريات مطابقة للخيارات المحددة.</div>`;
        return;
    }

    matches.forEach(item => {
        let leagueName = (item.league && item.league.name) ? item.league.name : "بطولة رسمية";
        let country = (item.league && item.league.country) ? item.league.country : "عالمي";
        
        let home = (item.teams && item.teams.home) ? item.teams.home.name : "مضيف";
        let away = (item.teams && item.teams.away) ? item.teams.away.name : "ضيف";
        let status = (item.fixture && item.fixture.status) ? item.fixture.status.short : "NS";
        let elapsed = (item.fixture && item.fixture.status && item.fixture.status.elapsed) ? item.fixture.status.elapsed : null;
        
        let matchDateStr = (item.fixture && item.fixture.date) ? item.fixture.date : "";
        let matchTime = "";
        if (matchDateStr) {
            let dateObj = new Date(matchDateStr);
            matchTime = dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        let goalsHome = (item.goals && item.goals.home !== null) ? item.goals.home : "-";
        let goalsAway = (item.goals && item.goals.away !== null) ? item.goals.away : "-";

        let isLive = ["1H", "2H", "ET", "P", "LIVE"].includes(status);
        let cardClass = isLive ? "match-card live" : "match-card";
        let statusColor = isLive ? "#ef4444" : "#94a3b8";

        let statusDescription = status;
        if (status === "NS") statusDescription = "لم تبدأ بعد";
        else if (status === "HT") statusDescription = "استراحة (HT)";
        else if (status === "FT") statusDescription = "انتهت (FT)";
        else if (isLive && elapsed) {
            let halfName = status === "1H" ? "الشوط الأول" : (status === "2H" ? "الشوط الثاني" : status);
            statusDescription = `${halfName} (${elapsed}')`;
        }

        let aiText = generateAIPrediction(home, away);

        output.innerHTML += `
            <div class="${cardClass}">
                <span style="color:${statusColor}; font-weight:bold; float:right;">${status}</span>
                <span style="color:#38bdf8; font-weight:bold;">🌍 ${country} - ${leagueName}</span><br>
                🏟️ <b>${home}</b> vs <b>${away}</b><br>
                <span style="color:#22c55e;">النتيجة الحية: <b>${goalsHome} - ${goalsAway}</b></span>
                
                <div class="match-info-row">
                    <span>⏰ التوقيت: <b>${matchTime ? matchTime : 'غير محدد'}</b></span>
                    <span>⏳ الحالة: <b>${statusDescription}</b></span>
                </div>

                <div class="ai-prediction">
                    ${aiText}
                </div>
            </div>
        `;
    });
}

function setStatusFilter(statusType, btnElement) {
    currentStatusFilter = statusType;
    document.querySelectorAll('.filter-tabs .tab-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
    applyFilters();
}

function filterByLeague(leagueKey, btnElement) {
    currentLeagueFilter = leagueKey;
    document.querySelectorAll('.leagues-container .league-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
    applyFilters();
}

function filterMatches() {
    applyFilters();
}

function applyFilters() {
    let query = document.getElementById('searchInput').value.toLowerCase();

    let filtered = allMatches.filter(item => {
        let league = (item.league && item.league.name) ? item.league.name.toLowerCase() : "";
        let country = (item.league && item.league.country) ? item.league.country.toLowerCase() : "";
        let homeTeam = (item.teams && item.teams.home) ? item.teams.home.name.toLowerCase() : "";
        let awayTeam = (item.teams && item.teams.away) ? item.teams.away.name.toLowerCase() : "";
        let status = (item.fixture && item.fixture.status) ? item.fixture.status.short : "NS";

        let isLive = ["1H", "2H", "ET", "P", "LIVE"].includes(status);
        let isUpcoming = status === "NS";

        // تصفية أزرار الحالة (Live / Upcoming)
        let matchesStatusTab = true;
        if (currentStatusFilter === 'live') matchesStatusTab = isLive;
        else if (currentStatusFilter === 'upcoming') matchesStatusTab = isUpcoming;

        // تصفية زر الدوري السريع
        let matchesLeagueBtn = true;
        if (currentLeagueFilter !== 'all') {
            matchesLeagueTab = country.includes(currentLeagueFilter.toLowerCase()) || league.includes(currentLeagueFilter.toLowerCase());
        }

        // تصفية خانة البحث اليدوي
        let matchesSearchQuery = league.includes(query) || homeTeam.includes(query) || awayTeam.includes(query) || country.includes(query);

        return matchesStatusTab && matchesLeagueBtn && matchesSearchQuery;
    });

    displayMatches(filtered);
}

window.onload = loadLiveMatches;
</script>

</body>
</html>
