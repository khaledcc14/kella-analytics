<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - Global Edition</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
            margin: 0;
            padding: 15px;
        }
        .card {
            background: #131b2e;
            border: 1px solid #1e293b;
            padding: 18px;
            border-radius: 18px;
            max-width: 480px;
            margin: 0 auto;
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.5);
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            text-align: center;
            font-size: 22px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }
        .subtitle {
            font-size: 11px;
            color: #94a3b8;
            text-align: center;
            margin-bottom: 12px;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 13px;
        }
        button.main-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .match-card {
            background: #0f172a;
            padding: 14px;
            margin-top: 10px;
            border-radius: 12px;
            border-left: 4px solid #38bdf8;
            font-size: 13px;
            border: 1px solid #1e293b;
        }
        .league-tag {
            font-size: 10px;
            color: #f59e0b;
            font-weight: bold;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .teams {
            font-weight: bold;
            font-size: 14px;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        .status-badge {
            background: #ef4444;
            color: white;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 4px;
            float: right;
            font-weight: bold;
        }
        .status-ns { background: #0284c7; }
        .status-ft { background: #64748b; }
        #output {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 5px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>KELLA Analytics Pro ⚽</h2>
        <div class="subtitle">Global Engine - Khaled</div>
        
        <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن نادي عالمي أو دوري (مثال: Real Madrid, Premier League)..." onkeyup="filterMatches()">
        
        <button class="main-btn" onclick="loadGlobalData()">تحديث كل الدوريات العالمية ⚡</button>
        
        <div id="output" style="text-align: center; color: #94a3b8; padding: 15px 0;">
            انقر الزر لعرض مباريات جميع الأندية والدوريات العالمية...
        </div>
    </div>

    <script>
        // قاعدة بيانات شاملة لكل الدوريات والأندية الكبرى عالمياً (مباشر وغير مباشر)
        const globalDatabase = [
            { country: "Spain", league: "La Liga", time: "21:00", status: "LIVE", statusClass: "", home: "Real Madrid", away: "Barcelona", scoreHome: "2", scoreAway: "1" },
            { country: "England", league: "Premier League", time: "18:30", status: "LIVE", statusClass: "", home: "Manchester City", away: "Arsenal", scoreHome: "1", scoreAway: "1" },
            { country: "England", league: "Premier League", time: "16:00", status: "FT", statusClass: "status-ft", home: "Liverpool", away: "Chelsea", scoreHome: "3", scoreAway: "1" },
            { country: "Italy", league: "Serie A", time: "20:45", status: "NS", statusClass: "status-ns", home: "Inter Milan", away: "Juventus", scoreHome: "0", scoreAway: "0" },
            { country: "Germany", league: "Bundesliga", time: "18:30", status: "FT", statusClass: "status-ft", home: "Bayern Munich", away: "Borussia Dortmund", scoreHome: "4", scoreAway: "2" },
            { country: "France", league: "Ligue 1", time: "21:00", status: "NS", statusClass: "status-ns", home: "Paris Saint-Germain", away: "Marseille", scoreHome: "0", scoreAway: "0" },
            { country: "Europe", league: "UEFA Champions League", time: "21:00", status: "LIVE", statusClass: "", home: "AC Milan", away: "Real Madrid", scoreHome: "1", scoreAway: "2" },
            { country: "Saudi Arabia", league: "Saudi Pro League", time: "20:00", status: "FT", statusClass: "status-ft", home: "Al Nassr", away: "Al Hilal", scoreHome: "2", scoreAway: "3" },
            { country: "Africa",league: "CAF Champions League", time: "18:00", status: "FT", statusClass: "status-ft", home: "Al Ahly", away: "Wydad Casablanca", scoreHome: "1", scoreAway: "0" }
        ];

        function displayMatches(dataToShow) {
            const outputDiv = document.getElementById('output');
            if (dataToShow.length === 0) {
                outputDiv.innerHTML = `<div style="color: #f59e0b; padding: 10px;">لا توجد نتائج مطابقة لبحثك.</div>`;
                return;
            }

            outputDiv.innerHTML = "";
            dataToShow.forEach(match => {
                outputDiv.innerHTML += `
                    <div class="match-card">
                        <div class="league-tag">🏆 ${match.country}: ${match.league} | ⏰ ${match.time}</div>
                        <span class="status-badge ${match.statusClass}">${match.status}</span>
                        <div class="teams">🏟️ ${match.home} vs ${match.away}</div>
                        <div style="margin-top: 8px; color: #38bdf8; font-size: 12px; border-top: 1px solid #1e293b; padding-top: 6px;">
                            النتيجة: <b>${match.scoreHome} - ${match.scoreAway}</b> | KELLA Global Pro
                        </div>
                    </div>
                `;
            });
        }

        function loadGlobalData() {
            const outputDiv = document.getElementById('output');
            outputDiv.innerHTML = `<div style="color: #38bdf8; padding: 10px;">جاري مزامنة دوريات العالم والأندية...</div>`;
            setTimeout(() => {
                displayMatches(globalDatabase);
            }, 300);
        }

        function filterMatches() {
            let query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = globalDatabase.filter(m => 
                m.home.toLowerCase().includes(query) || 
                m.away.toLowerCase().includes(query) || 
                m.league.toLowerCase().includes(query) ||
                m.country.toLowerCase().includes(query)
            );
            displayMatches(filtered);
        }

        // عرض القائمة الشاملة مباشرة عند الفتح
        window.onload = function() {
            displayMatches(globalDatabase);
        };
    </script>
</body>
</html>
