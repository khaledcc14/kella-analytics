<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KELLA Analytics Pro</title>
<meta name="theme-color" content="#0b0f19">
<style>
body {
    background: #0b0f19;
    color: #f8fafc;
    font-family: Arial, sans-serif;
    margin: 0;
    padding-bottom: 70px;
}
.app-container {
    max-width: 480px;
    margin: 0 auto;
    padding: 10px;
}
.top-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 10px;
}
.top-header h2 {
    color: #38bdf8;
    margin: 0;
    font-size: 18px;
}
.status-star {
    font-size: 20px;
}
.mode-toggle {
    display: flex;
    background: #131b2e;
    border-radius: 25px;
    padding: 4px;
    margin: 10px 0;
    border: 1px solid #1e293b;
}
.mode-btn {
    flex: 1;
    background: transparent;
    color: #94a3b8;
    border: none;
    padding: 8px;
    font-size: 13px;
    font-weight: bold;
    border-radius: 20px;
    cursor: pointer;
}
.mode-btn.active {
    background: #22c55e;
    color: #0b0f19;
}
.search-box {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #1e293b;
    background: #131b2e;
    color: #f8fafc;
    margin-bottom: 10px;
    box-sizing: border-box;
    font-size: 13px;
}
.match-card {
    background: #131b2e;
    border: 1px solid #1e293b;
    border-left: 4px solid #38bdf8;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    font-size: 13px;
    cursor: pointer;
}
.ai-prediction {
    margin-top: 8px;
    padding: 8px;
    background: #0f172a;
    border: 1px dashed #38bdf8;
    border-radius: 8px;
    font-size: 12px;
    color: #38bdf8;
}
.back-btn {
    background: #1e293b;
    color: #38bdf8;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    margin-bottom: 10px;
    cursor: pointer;
    font-weight: bold;
}
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    display: flex;
    justify-content: space-around;
    padding: 8px 0;
    z-index: 1000;
}
.nav-item {
    background: transparent;
    border: none;
    color: #94a3b8;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    gap: 2px;
}
.nav-item.active {
    color: #22c55e;
    font-weight: bold;
}
.nav-item span.icon {
    font-size: 18px;
}
</style>
</head>
<body>

<div class="app-container">
    <div class="top-header">
        <h2>KELLA Analytics Pro ⚽</h2>
        <span id="connectionStar" class="status-star">⏳</span>
    </div>

    <div class="mode-toggle">
        <button class="mode-btn" onclick="setMode('live', this)">EN DIRECT</button>
        <button class="mode-btn active" onclick="setMode('upcoming', this)">Avant-match</button>
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن فريق..." onkeyup="filterData()">

    <div id="output"></div>
</div>

<div class="bottom-nav">
    <button class="nav-item active" onclick="switchTab('popular', this)"><span class="icon">🔥</span> Populaire</button>
    <button class="nav-item" onclick="switchTab('favorites', this)"><span class="icon">⭐</span> Favoris</button>
    <button class="nav-item" onclick="switchTab('coupon', this)"><span class="icon">🎟️</span> Coupon</button>
    <button class="nav-item" onclick="switchTab('history', this)"><span class="icon">⏰</span> Historique</button>
    <button class="nav-item" onclick="switchTab('menu', this)"><span class="icon">📂</span> Menu</button>
</div>

<script>
let allMatches = [];
let currentMode = 'upcoming';
let currentTab = 'popular';

async function initApp() {
    try {
        const cacheBuster = '?t=' + new Date().getTime();
        const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json' + cacheBuster);
        if (!response.ok) throw new Error("Server error");
        
        const jsonResult = await response.json();
        allMatches = jsonResult.response || [];
        
        document.getElementById('connectionStar').innerHTML = "🟢";
        renderContent();
    } catch (e) {
        document.getElementById('connectionStar').innerHTML = "🔴";
        document.getElementById('output').innerHTML = `<div style="text-align: center; color: #ef4444; padding: 30px;">تعذر الاتصال بالخادم</div>`;
    }
}

function setMode(mode, btn) {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
    if(btn) btn.classList.add('active');
    currentMode = mode;
    renderContent();
}

function renderContent() {
    const output = document.getElementById('output');
    let matches = getFilteredMatches();
    
    if (matches.length === 0) {
        output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px;">لا توجد مباريات في هذا القسم حالياً.</div>`;
        return;
    }

    let html = "";
    matches.forEach((item, index) => {
        let leagueName = item.league?.name || "مباريات اليوم";
        let home = item.teams?.home?.name || "مضيف";
        let away = item.teams?.away?.name || "ضيف";

        html += `
            <div class="match-card" onclick="showMatchDetails(${index})">
                <div style="color:#38bdf8; font-weight:bold; margin-bottom: 5px;">🏆 ${leagueName}</div>
                <div style="font-size: 14px; font-weight: bold;">${home} vs ${away}</div>
                <div class="ai-prediction">
                    🤖 <b>تحليل الذكاء الاصطناعي:</b> اضغط لعرض تفاصيل المباراة وإحصائياتها.
                </div>
            </div>
        `;
    });
    output.innerHTML = html;
}

function getFilteredMatches() {
    return allMatches.filter(item => {
        let status = item.fixture?.status?.short || "NS";
        let isLive = ["1H", "2H", "HT", "ET", "P", "LIVE"].includes(status);
        return currentMode === 'live' ? isLive : !isLive;
    });
}

function showMatchDetails(index) {
    let matches = getFilteredMatches();
    let item = matches[index];
    if (!item) return;

    let leagueName = item.league?.name || "بطولة رسمية";
    let country = item.league?.country || "عالمي";
    let home = item.teams?.home?.name || "مضيف";
    let away = item.teams?.away?.name || "ضيف";
    let status = item.fixture?.status?.short || "NS";
    let homeGoals = item.goals?.home ?? "-";
    let awayGoals = item.goals?.away ?? "-";

    const output = document.getElementById('output');
    output.innerHTML = `
        <button class="back-btn" onclick="renderContent()">⬅ العودة للمباريات</button>
        <div class="match-card" style="cursor: default; border-left-color: #22c55e;">
            <div style="color:#22c55e; font-weight:bold; margin-bottom: 8px;">📊 تفاصيل المواجهة</div>
            <div style="font-size: 12px; color: #94a3b8; margin-bottom: 5px;">البطولة: ${country} - ${leagueName}</div>
            <div style="font-size: 16px; font-weight: bold; margin: 10px 0; text-align: center;">${home} [ ${homeGoals} - ${awayGoals} ] ${away}</div>
            <div style="font-size: 12px; color: #38bdf8; margin-bottom: 10px;">حالة المباراة: ${status === 'NS' ? 'لم تبدأ بعد' : status}</div>
            <div class="ai-prediction">
                🤖 <b>تحليل الذكاء الاصطناعي الشامل:</b> الفريقان يمتلكان حظوظاً متقاربة، وسط توقعات بمباراة تكتيكية عالية من المدربين.
            </div>
        </div>
    `;
}

function switchTab(tab, b) {
    document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentTab = tab;
}

function filterData() {
    let q = document.getElementById('searchInput').value.toLowerCase();
    let output = document.getElementById('output');
    let matches = getFilteredMatches();
    let filtered = matches.filter(i => {
        let h = i.teams?.home?.name?.toLowerCase() || '';
        let a = i.teams?.away?.name?.toLowerCase() || '';
        let l = i.league?.name?.toLowerCase() || '';
        return h.includes(q) || a.includes(q) || l.includes(q);
    });

    if (filtered.length === 0) {
        output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px;">لا توجد نتائج مطابقة لبحثك.</div>`;
        return;
    }

    let html = "";
    filtered.forEach((item, index) => {
        let home = item.teams?.home?.name || "مضيف";
        let away = item.teams?.away?.name || "ضيف";
        html += `
            <div class="match-card" onclick="showMatchDetails(${index})">
                <div style="font-size: 14px; font-weight: bold;">${home} vs ${away}</div>
            </div>
        `;
    });
    output.innerHTML = html;
}

window.onload = initApp;
</script>

</body>
</html>
