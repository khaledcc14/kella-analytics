<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width5=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - التحليل الذكي للمباريات</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #38bdf8;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #94a3b8;
        }
        select, input {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }
        button:hover {
            background: #0369a1;
        }
        .result-box {
            margin-top: 25px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .live-badge {
            background: #ef4444;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .stats-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            padding: 8px;
            background: #1e293b;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>KELLA Analytics Pro ⚽</h1>
        
        <div class="form-group">
            <label for="homeTeam">الفريق المستضيف:</label>
            <input type="text" id="homeTeam" placeholder="مثال: ريال مدريد أو الأهلي المصري" value="ريال مدريد">
        </div>

        <div class="form-group">
            <label for="awayTeam">الفريق الضيف:</label>
            <input type="text" id="awayTeam" placeholder="مثال: برشلونة" value="برشلونة">
        </div>

        <div class="form-group">
            <label for="matchMode">وضع التحليل:</label>
            <select id="matchMode">
                <option value="pre">ما قبل المباراة (Pre-Match)</option>
                <option value="live">أثناء المباراة (Live Tracking)</option>
            </select>
        </div>

        <button onclick="runAnalysis()">تشغيل تحليل الذكاء الاصطناعي</button>

        <div id="output" class="result-box" style="display: none;">
            <!-- هنا تظهر النتائج والتحليلات -->
        </div>
    </div>

    <!-- استدعاء ملف المحرك البرمجي -->
    <script src="ai-predictor.js"></script>
    <script>
        const predictor = new KellaAIPredictor();

        function runAnalysis() {
            const home = document.getElementById('homeTeam').value.trim();
            const away = document.getElementById('awayTeam').value.trim();
            const mode = document.getElementById('matchMode').value;
            const outputDiv = document.getElementById('output');

            if (!home || !away) {
                alert('الرجاء إدخال اسم الفريقين!');
                return;
            }

            outputDiv.style.display = 'block';

            if (mode === 'pre') {
                // تحليل ما قبل المباراة
                let result = predictor.generateMatchIntelligence(home, away, "General Competition");
                outputDiv.innerHTML = `
                    <h3>📊 قراءة ما قبل اللقاء</h3>
                    <div class="stats-row"><span>التوقع المتوقع:</span> <strong>${result.predictedScore}</strong></div>
                    <div class="stats-row"><span>نسب الفوز:</span> <strong>${home}: ${result.probabilities.home} | تعادل: ${result.probabilities.draw} | ${away}: ${result.probabilities.away}</strong></div>
                    <div class="stats-row"><span>الأهداف المتوقعة:</span> <strong>${result.expectedGoals}</strong></div>
                    <p style="color: #38bdf8; margin-top: 10px;">💡 <strong>رأي الذكاء الاصطناعي:</strong> ${result.aiAdvice}</p>
                `;
            } else {
                // محاكاة تحليل أثناء المباراة (مع بيانات تجريبية حية للبطاقات والدقيقة)
                let mockMinute = 78;
                let mockHomeScore = 2;
                let mockAwayScore = 1;
                let mockYellows = { home: 2, away: 3 };
                let mockReds = { home: 0, away: 1 };

                let result = predictor.generateLiveIntelligence(home, away, mockMinute, mockHomeScore, mockAwayScore, mockYellows, mockReds);
                
                outputDiv.innerHTML = `
                    <span class="live-badge">LIVE 🔴 ${result.minute}</span>
                    <h3>⚡ التحديث الحي للمباراة</h3>
                    <div class="stats-row"><span>النتيجة الحية:</span> <strong>${result.liveScore}</strong></div>
                    <div class="stats-row"><span>الإنذارات:</span> <strong>${result.cards.yellow}</strong></div>
                    <div class="stats-row"><span>الطرد:</span> <strong>${result.cards.red}</strong></div>
                    <div class="stats-row"><span>نسب الفوز المحدثة:</span> <strong>${home}: ${result.probabilities.home} | تعادل: ${result.probabilities.draw} | ${away}: ${result.probabilities.away}</strong></div>
                    <p style="color: #f43f5e; margin-top: 10px;">🔥 <strong>تنبيه ذكي:</strong> ${result.aiAdvice}</p>
                `;
            }
        }
    </script>
</body>
</html>
