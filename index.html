<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro</title>
    <meta name="theme-color" content="#0F0F19">
    <style>
        body {
            background: #0f0f19;
            color: #f3f4f6;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            padding: 10px;
        }
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }
        .top-header h2 {
            color: #38bdf8;
            margin: 0;
            font-size: 18px;
        }
        .status-star {
            font-size: 23px;
        }
        .mode-toggle {
            display: flex;
            background: #131b2a;
            border-radius: 25px;
            padding: 4px;
            margin: 10px 0;
            border: 1px solid #1e293b;
        }
        .mode-btn {
            flex: 1;
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #22c55e;
            color: #0f0f19;
        }
        .search-box {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #1e293b;
            background: #131b2a;
            color: #f3f4f6;
            margin-bottom: 10px;
            box-sizing: border-box;
            font-size: 13px;
        }
        .match-card {
            background: #131b2a;
            border: 1px solid #1e293b;
            border-left: 4px solid #38bdf8;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 11px;
            font-size: 13px;
            position: relative;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 1000;
        }
        .nav-item {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            gap: 2px;
        }
        .nav-item.active {
            color: #22c55e;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="top-header">
            <h2>KELLA Analytics Pro ⚽</h2>
            <span id="connectionStar" class="status-star">🟡</span>
        </div>

        <div id="mainModeToggle" class="mode-toggle">
            <button class="mode-btn active" onclick="setMode('live', this)">EN DIRECT</button>
            <button class="mode-btn" onclick="setMode('upcoming', this)">Avant-match</button>
        </div>

        <div id="searchContainer">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن فريق..." onkeyup="filterData()">
        </div>

        <div id="output"></div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('popular', this)"><span>🔥</span> Populaire</button>
        <button class="nav-item" onclick="switchTab('favorites', this)"><span>⭐</span> Favoris</button>
        <button class="nav-item" onclick="switchTab('history', this)"><span>⏰</span> Historique</button>
        <button class="nav-item" onclick="switchTab('menu', this)"><span>📁</span> Menu</button>
    </div>

    <script>
        let allMatches = [];
        let currentMode = 'upcoming';
        let currentTab = 'popular';
        let favorites = JSON.parse(localStorage.getItem('kella_favs') || '[]');

        async function initApp() {
            try {
                const response = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Network error');
                const jsonResult = await response.json();
                allMatches = jsonResult.matches || [];
                document.getElementById('connectionStar').innerHTML = '🟢';
                renderContent();
            } catch (e) {
                document.getElementById('connectionStar').innerHTML = '🟡';
                allMatches = [];
                renderContent();
            }
        }

        function setMode(mode, btn) {
            document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
            btn.classList.add('active');
            currentMode = mode;
            renderContent();
        }

        function switchTab(tab, b) {
            document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
            b.classList.add('active');
            currentTab = tab;
            let modeToggle = document.getElementById('mainModeToggle');
            let searchContainer = document.getElementById('searchContainer');
            if (tab === 'popular') {
                modeToggle.style.display = 'flex';
                searchContainer.style.display = 'block';
                renderContent();
            } else {
                modeToggle.style.display = 'none';
                searchContainer.style.display = 'none';
                if (tab === 'menu') renderMenu();
            }
        }

        function renderContent() {
            const output = document.getElementById('output');
            if (allMatches.length === 0) {
                output.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 30px;">لا توجد مباريات في هذا القسم حالياً.</div>`;
                return;
            }
            let html = '';
            allMatches.forEach((item, index) => {
                let league = item.league?.name || 'General';
                let home = item.teams?.home?.name || 'Home';
                let away = item.teams?.away?.name || 'Away';
                let status = item.fixture?.status?.short || 'NS';
                html += `
                    <div class="match-card">
                        <div style="font-size: 11px; color: #94a3b8; margin-bottom: 5px;">🏆 ${league}</div>
                        <div style="font-size: 15px; font-weight: bold; color: #f3f4f6;">${home} vs ${away}</div>
                        <div style="font-size: 12px; color: #38bdf8; margin-top: 5px;">الحالة: ${status}</div>
                    </div>
                `;
            });
            output.innerHTML = html;
        }

        function renderMenu() {
            document.getElementById('output').innerHTML = `
                <div style="background: #131b2a; padding: 15px; border-radius: 10px; border: 1px solid #1e293b;">
                    <div style="color: #38bdf8; font-weight: bold; margin-bottom: 8px;">إعدادات التطبيق KELLA Analytics Pro v2.2</div>
                    <div style="font-size: 13px; margin-bottom: 8px;">مصدر البيانات: Direct API & Cloud Sync</div>
                    <div style="font-size: 13px;">🟢 متصل بنجاح</div>
                </div>
            `;
        }

        window.onload = initApp;
    </script>
</body>
</html>
