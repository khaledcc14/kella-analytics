<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KELLA Analytics Pro - عرض جميع النتائج</title>
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-dark: #aa8c2c;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(20, 20, 20, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
        }

        .overlay {
            min-height: 100vh;
            background: linear-gradient(rgba(10, 10, 10, 0.88), rgba(10, 10, 10, 0.96));
            padding: 20px;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .gold-logo {
            font-size: 2.6rem;
            font-weight: bold;
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary), var(--gold-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .splash-sub {
            margin-top: 15px;
            color: var(--gold-light);
            font-size: 0.95rem;
            text-align: center;
        }

        #app-container {
            display: none;
            max-width: 950px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--gold-primary);
            padding-bottom: 15px;
        }

        header h1 {
            background: linear-gradient(135deg, var(--gold-light), var(--gold-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.9rem;
            margin-bottom: 5px;
        }

        .sports-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 10px;
        }

        .sport-cell {
            height: 150px;
            border-radius: 14px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border: 2px solid var(--gold-dark);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding-bottom: 15px;
            background-size: cover;
            background-position: center;
        }

        .sport-cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.3) 100%);
        }

        .sport-title {
            color: var(--gold-light);
            font-weight: bold;
            font-size: 1.1rem;
            position: relative;
            z-index: 2;
        }

        #sub-view { display: none; }
        .back-btn {
            background: var(--gold-primary);
            color: #000;
            border: none;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .status-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--gold-dark);
            color: #aaa;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .tab-btn.active {
            background: var(--gold-primary);
            color: #000;
        }

        .leagues-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            max-height: 55vh;
            overflow-y: auto;
            padding: 5px;
        }

        .league-card {
            background: var(--card-bg);
            border: 1px solid var(--gold-dark);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #analytics-view {
            display: none;
            background: var(--card-bg);
            border: 2px solid var(--gold-primary);
            border-radius: 14px;
            padding: 18px;
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="gold-logo">KELLA Analytics Pro</div>
        <div class="splash-sub" id="loading-text">جاري الاتصال بالسحابة...</div>
    </div>

    <div class="overlay">
        <div id="app-container">
            <header>
                <h1>KELLA Analytics Pro</h1>
                <p style="color: var(--gold-light); font-size: 0.85rem;">منصة التحليل والذكاء الاصطناعي الرياضي</p>
            </header>

            <div id="main-dashboard" class="sports-grid">
                <div class="sport-cell" style="background-image: url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?q=80&w=600&auto=format&fit=crop');" onclick="openLeagues('football')">
                    <div class="sport-title">كرة القدم (التحليل الذكي)</div>
                </div>
            </div>

            <div id="sub-view">
                <button class="back-btn" onclick="goBackToMain()">← العودة للرئيسية</button>
                <h2 id="selected-sport-title" style="color: var(--gold-primary); margin-bottom: 10px; font-size: 1.2rem;"></h2>
                
                <div class="status-tabs" id="football-tabs">
                    <button class="tab-btn active" onclick="filterMatches('ALL')">📋 كل النتائج</button>
                    <button class="tab-btn" onclick="filterMatches('LIVE')">🔴 المباشرة</button>
                </div>

                <div class="leagues-grid" id="leagues-container"></div>
            </div>

            <div id="analytics-view">
                <button class="back-btn" onclick="goBackToLeagues()">← العودة للقائمة</button>
                <div id="match-details-content" style="color: #fff; padding: 10px;"></div>
            </div>
        </div>
    </div>

    <script>
        let matchesData = { ALL: [], LIVE: [] };

        async function fetchMatches() {
            try {
                // جلب البيانات من live.json مع منع التخزين المؤقت نهائياً
                const res = await fetch('https://raw.githubusercontent.com/khaledcc14/kella-analytics/main/live.json?t=' + Date.now(), {
                    cache: 'no-store'
                });
                
                const data = await res.json();
                const rawList = Array.isArray(data) ? data : (data.matches || []);

                let allParsed = [];
                rawList.forEach((m, idx) => {
                    allParsed.push({
                        id: m.id || idx,
                        homeTeam: { name: m.home || m.homeTeam || 'الفريق الأول' },
                        awayTeam: { name: m.away || m.awayTeam || 'الفريق الثاني' },
                        status: m.status || 'LIVE',
                        competition: { name: m.league || 'الدوري العام' },
                        aiRate: m.aiRate || 80
                    });
                });

                matchesData.ALL = allParsed;
                matchesData.LIVE = allParsed.filter(m => String(m.status).toUpperCase().includes('LIVE'));

                // إخفاء شاشة التحميل وإظهار التطبيق
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';

            } catch (err) {
                console.error("خطأ في الجلب:", err);
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
            }
        }

        window.onload = fetchMatches;

        function openLeagues(sportType) {
            document.getElementById('main-dashboard').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
            document.getElementById('selected-sport-title').innerText = 'تحليلات كرة القدم الحية';
            renderList(matchesData.ALL);
        }

        function filterMatches(type) {
            if (type === 'LIVE') renderList(matchesData.LIVE);
            else renderList(matchesData.ALL);
        }

        function renderList(list) {
            const container = document.getElementById('leagues-container');
            container.innerHTML = '';
            
            if (!list || list.length === 0) {
                container.innerHTML = '<p style="color: #aaa; text-align: center; grid-column: span 2; padding: 20px;">لا توجد أي مباريات حالياً في ملف السحابة (live.json فارغ).</p>';
                return;
            }

            list.forEach(m => {
                const card = document.createElement('div');
                card.className = 'league-card';
                card.innerHTML = `
                    <div style="font-size: 0.75rem; color: var(--gold-light);">${m.competition.name}</div>
                    <div style="font-weight: bold; font-size: 0.95rem; margin: 5px 0;">
                        ${m.homeTeam.name} <span style="color: var(--gold-primary);">VS</span> ${m.awayTeam.name}
                    </div>
                    <div style="font-size: 0.75rem; color: #aaa;">الحالة: ${m.status}</div>
                `;
                container.appendChild(card);
            });
        }

        function goBackToMain() {
            document.getElementById('sub-view').style.display = 'none';
            document.getElementById('main-dashboard').style.display = 'grid';
        }

        function goBackToLeagues() {
            document.getElementById('analytics-view').style.display = 'none';
            document.getElementById('sub-view').style.display = 'block';
        }
    </script>
</body>
</html>
