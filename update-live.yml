name: Update Live Scores Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script to fetch and format API data safely
        run: |
          python -c '
          import urllib.request
          import json
          import datetime

          today_date = datetime.datetime.now().strftime("%Y-%m-%d")
          api_url = f"https://v3.football.api-sports.io/fixtures?date={today_date}"
          
          headers = {
              "x-apisports-key": "9089a8397ff28245938e358f0c9b5847"
          }

          try:
              req = urllib.request.Request(api_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  res_body = response.read().decode()
                  data = json.loads(res_body)
                  
                  # التأكد من أن البيانات صالحة وليست فارغة
                  if "response" in data:
                      out_data = data
                  else:
                      out_data = {"response": []}

                  with open("live.json", "w", encoding="utf-8") as f:
                      json.dump(out_data, f, ensure_ascii=False, indent=4)
                  print("Live.json updated safely!")
          except Exception as e:
              print("Error occurred, keeping safe fallback:", e)
              # قالب احتياطي آمن يمنع خطأ 500 إذا انقطع الـ API
              fallback = {"response": []}
              with open("live.json", "w", encoding="utf-8") as f:
                  json.dump(fallback, f, ensure_ascii=False, indent=4)
          '

      - name: Commit and push changes to GitHub
        run: |
          git config --global user.name "Kella Cron Bot"
          git config --global user.email "bot@kella.com"
          git add live.json
          git commit -m "Safe update live.json [skip ci]" || echo "No changes to commit"
          git push
