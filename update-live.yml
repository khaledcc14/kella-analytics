name: Update Live Scores Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script to fetch live events and scores
        run: |
          python -c '
          import urllib.request
          import json
          import datetime

          today_date = datetime.datetime.now().strftime("%Y-%m-%d")
          # جلب مباريات اليوم مع التركيز على المباشر والحالي
          api_url = f"https://v3.football.api-sports.io/fixtures?date={today_date}"
          
          headers = {
              "x-apisports-key": "9089a8397ff28245938e358f0c9b5847"
          }

          try:
              req = urllib.request.Request(api_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  res_body = response.read().decode()
                  api_data = json.loads(res_body)
                  
                  matches_list = []
                  if "response" in api_data:
                      for item in api_data["response"]:
                          league = item.get("league", {}).get("name", "General")
                          
                          home_team = item.get("teams", {}).get("home", {}).get("name", "Home")
                          away_team = item.get("teams", {}).get("away", {}).get("name", "Away")
                          
                          goals_home = item.get("goals", {}).get("home")
                          goals_away = item.get("goals", {}).get("away")
                          
                          fixture_status = item.get("fixture", {}).get("status", {})
                          status_short = fixture_status.get("short", "NS")
                          elapsed = fixture_status.get("elapsed", 0)
                          
                          matches_list.append({
                              "league": league,
                              "homeTeam": home_team,
                              "awayTeam": away_team,
                              "homeGoals": goals_home if goals_home is not None else 0,
                              "awayGoals": goals_away if goals_away is not None else 0,
                              "status": status_short,
                              "elapsed": elapsed
                          })

                  final_output = {"matches": matches_list}

                  with open("live.json", "w", encoding="utf-8") as f:
                      json.dump(final_output, f, ensure_ascii=False, indent=4)
                  print("Live events and scores updated successfully!")
          except Exception as e:
              print("Error fetching live events:", e)
          '

      - name: Commit and push changes to GitHub
        run: |
          git config --global user.name "Kella Cron Bot"
          git config --global user.email "bot@kella.com"
          git add live.json
          git commit -m "Update live match events and scores [skip ci]" || echo "No changes to commit"
          git push
