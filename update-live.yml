name: Update Live Scores Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script to fetch real API and update live.json
        run: |
          python -c '
          import urllib.request
          import json
          import datetime

          today_date = datetime.datetime.now().strftime("%Y-%m-%d")
          api_url = f"https://v3.football.api-sports.io/fixtures?date={today_date}"
          
          headers = {
              "x-apisports-key": "9089a8397ff28245938e358f0c9b5847"
          }

          try:
              req = urllib.request.Request(api_url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  
                  with open("live.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, indent+4 if False else 4)
                  print("Live.json updated successfully with real API data!")
          except Exception as e:
              print("Error fetching real API data:", e)
          '

      - name: Commit and push changes to GitHub
        run: |
          git config --global user.name "Kella Cron Bot"
          git config --global user.email "bot@kella.com"
          git add live.json
          git commit -m "Auto-update live matches from API-Football [skip ci]" || echo "No changes to commit"
          git push
