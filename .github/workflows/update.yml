name: Update Football Data On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Format Real API Data
        run: |
          python -c '
          import urllib.request
          import json

          api_key = "a8950bd15129e3c88a017109cb2dd1981661bb901886343"
          # استعلام شامل للبطولات الكبرى مباشرة لتجنب قيود النطاق الزمني الضيق
          url = f"https://apiv3.apifootball.com/?action=get_matches&APIkey={api_key}&from=2026-09-17&to=2026-09-17"

          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode()
                  api_matches = json.loads(raw_data)
                  
                  if not isinstance(api_matches, list):
                      api_matches = []

                  formatted_matches = []
                  for m in api_matches:
                      match_obj = {
                          "league": {
                              "name": m.get("league_name", "General")
                          },
                          "teams": {
                              "home": {"name": m.get("match_hometeam_name", "Home")},
                              "away": {"name": m.get("match_awayteam_name", "Away")}
                          },
                          "fixture": {
                              "status": {"short": m.get("match_status", "NS")}
                          },
                          "goals": {
                              "home": m.get("match_hometeam_score", 0),
                              "away": m.get("match_awayteam_score", 0)
                          }
                      }
                      formatted_matches.append(match_obj)

                  final_output = {"matches": formatted_matches}
                  with open("live.json", "w", encoding="utf-8") as f:
                      json.dump(final_output, f, ensure_ascii=False, indent=4)
                  print(f"Successfully processed {len(formatted_matches)} matches.")
          except Exception as e:
              print("Error:", e)
          '

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update live.json with real API matches [skip ci]"
          git push || echo "Push skipped or no changes"
          
