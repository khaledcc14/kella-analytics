name: Update Football Data

on:
  schedule:
    - cron: '0 * * * *' # يتم التحديث كل ساعة أوتوماتيكياً
  workflow_dispatch: # زر لتشغيل التحديث يدوياً متى شئت من موقع GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script to fetch data
        run: python update_scores.py

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "KELLA Bot"
          git config --global user.email "bot@github.com"
          git add live.json
          git commit -m "Auto-update live football data [skip ci]" || exit 0
          git push
          
