name: Update Football Data On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run smart fetch script with full debug
        run: |
          python -c '
          import urllib.request
          import json
          from datetime import datetime, timedelta

          api_key = "9089a8397ff28245938e358f0c9b5847"
          headers = {"x-apisports-key": api_key}

          algeria_time = datetime.utcnow() + timedelta(hours=1)
          today_str = algeria_time.strftime("%Y-%m-%d")
          print(f"Target Date: {today_str}")

          url = f"https://v3.football.api-sports.io/fixtures?date={today_str}"
          req = urllib.request.Request(url, headers=headers)
          
          try:
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode()
                  data = json.loads(raw_data)
                  print("API Raw Response Status/Headers info received successfully.")
                  
                  # طباعة عدد النتائج للعلم
                  matches_list = data.get("response", [])
                  print(f"Total matches returned by API: {len(matches_list)}")
                  
                  # إذا كانت القائمة فارغة، نطبع جزء من استجابة الـ API لنفهم السبب
                  if len(matches_list) == 0:
                      print("Full API JSON Response:", raw_data[:500])
                  
                  final_output = {"matches": matches_list}
                  with open("live.json", "w", encoding="utf-8") as f:
                      json.dump(final_output, f, ensure_ascii=False, indent=4)
          except Exception as e:
              print("Critical API Error:", e)
          '

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update live.json debug [skip ci]"
          git push || echo "Push skipped or no changes"
          
