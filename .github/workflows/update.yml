name: Update SportMonks Live Matches

on:
  schedule:
    - cron: '0 * * * *' # يتم التحديث تلقائياً كل ساعة
  workflow_dispatch: # يتيح التشغيل اليدوي من زر Run workflow

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Requests Library
        run: |
          pip install requests

      - name: Run SportMonks Fetch Script
        run: |
          python update_matches.py

      - name: Commit and Push live.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add live.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update live.json via SportMonks API [skip ci]"
          git push
          
