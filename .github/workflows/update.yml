name: Update Football Data On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Print Raw API Response
        run: |
          python -c '
          import urllib.request

          api_key = "a8950bd15129e3c88a017109cb2dd1981661bb901886343"
          url = f"https://apiv3.apifootball.com/?action=get_matches&APIkey={api_key}&from=2026-09-16&to=2026-09-16"

          try:
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode()
                  print("--- RAW API RESPONSE START ---")
                  print(raw_data[:2000]) # طباعة جزء كبير من رد الـ API للتحقق
                  print("--- RAW API RESPONSE END ---")
          except Exception as e:
              print("Error fetching API:", e)
          '
          
