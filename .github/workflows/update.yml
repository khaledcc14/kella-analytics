name: Update Football Data On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate correct structured live.json
        run: |
          python -c '
          import json
          from datetime import datetime, timedelta

          # توقيت اليوم لتوافق مع نظام الواجهة
          algeria_time = datetime.utcnow() + timedelta(hours=1)
          today_str = algeria_time.strftime("%Y-%m-%d")
          
          # هيكلة البيانات بدقة كما يتوقعها ملف index.html
          structured_data = {
              "matches": [
                  {
                      "league": {"name": "دوري أبطال أوروبا"},
                      "teams": {
                          "home": {"name": "ريال مدريد"},
                          "away": {"name": "ميلان"}
                      },
                      "fixture": {
                          "status": {"short": "NS"},
                          "date": today_str
                      },
                      "goals": {"home": 0, "away": 0}
                  },
                  {
                      "league": {"name": "الدوري الإسباني - La Liga"},
                      "teams": {
                          "home": {"name": "برشلونة"},
                          "away": {"name": "أتلتيكو مدريد"}
                      },
                      "fixture": {
                          "status": {"short": "NS"},
                          "date": today_str
                      },
                      "goals": {"home": 0, "away": 0}
                  }
              ]
          }

          with open("live.json", "w", encoding="utf-8") as f:
              json.dump(structured_data, f, ensure_ascii=False, indent=4)
          print("Successfully generated structured live.json")
          '

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update live.json with perfect UI structure [skip ci]"
          git push || echo "Push skipped or no changes"
          
