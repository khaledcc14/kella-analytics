name: Update Football Data On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script with official API endpoint
        run: |
          python -c '
          import urllib.request
          import json

          api_key = "a8950bd15129e3c88a017109cb2dd1981661bb901886343"
          
          # نستخدم الرابط الرسمي للـ Endpoints المعتمدة حسب التوثيق
          url = f"https://apiv3.apifootball.com/?action=get_matches&APIkey={api_key}&from=2026-09-15&to=2026-09-16"
          
          try:
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode()
                  
                  # أحياناً الـ API يرجع مصفوفة مباشرة أو ديكشنري
                  try:
                      data = json.loads(raw_data)
                  except:
                      data = []

                  print("API Data fetched successfully.")
                  
                  # تحويل البيانات إلى الشكل الذي يتوقعه تطبيقك (matches)
                  if isinstance(data, dict):
                      matches_list = data.get("result", [])
                      if not matches_list:
                          # تجربة مفتاح آخر في حال اختلاف شكل الاستجابة
                          matches_list = list(data.values()) if data else []
                  elif isinstance(data, list):
                      matches_list = data
                  else:
                      matches_list = []

                  print(f"Total matches loaded: {len(matches_list)}")
                  
                  final_output = {"matches": matches_list}
                  with open("live.json", "w", encoding="utf-8") as f:
                      json.dump(final_output, f, ensure_ascii=False, indent=4)
          except Exception as e:
              print("Critical Error:", e)
          '

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update live.json using official endpoint [skip ci]"
          git push || echo "Push skipped or no changes"
          
