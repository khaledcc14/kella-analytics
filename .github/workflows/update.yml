name: Update Football Data On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch and Format Matches to Match App Structure
        run: |
          python -c '
          import urllib.request
          import json
          from datetime import datetime, timedelta

          api_key = "a8950bd15129e3c88a017109cb2dd1981661bb901886343"
          
          # جلب مباريات اليوم والأيام القريبة
          today = datetime.now()
          from_date = (today - timedelta(days=1)).strftime("%Y-%m-%d")
          to_date = (today + timedelta(days=2)).strftime("%Y-%m-%d")

          url = f"https://apiv3.apifootball.com/?action=get_matches&APIkey={api_key}&from={from_date}&to={to_date}"

          try:
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(req) as response:
                  raw_data = response.read().decode()
                  api_matches = json.loads(raw_data)
                  
                  if not isinstance(api_matches, list):
                      api_matches = []

                  # تجميع المباريات حسب التاريخ تماماً مثل server.js
                  matches_database = {}
                  
                  for m in api_matches:
                      match_date = m.get("match_date", "2026-09-17")
                      
                      home_score = m.get("match_hometeam_score", "0")
                      away_score = m.get("match_awayteam_score", "0")
                      score_str = f"{home_score} - {away_score}" if home_score is not None and away_score is not None else "vs"

                      match_item = {
                          "league": m.get("league_name", "General"),
                          "home": m.get("match_hometeam_name", "Home Team"),
                          "away": m.get("match_awayteam_name", "Away Team"),
                          "time": m.get("match_time", "20:00"),
                          "score": score_str,
                          "odds": "1: 1.85 | 2: 2.10"
                      }
                      
                      if match_date not in matches_database:
                          matches_database[match_date] = []
                      matches_database[match_date].append(match_item)

                  # حفظ البيانات بالهيكلة المطابقة تماماً لقاعدة البيانات الأصلية
                  with open("live.json", "w", encoding="utf-8") as f:
                      json.dump(matches_database, f, ensure_ascii=False, indent=4)
                      
                  print(f"Successfully processed matches into original flat structure format.")
          except Exception as e:
              print("Error:", e)
          '

      - name: Commit and push changes safely
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update live.json with exact app-compatible structure [skip ci]"
          git push || echo "Push skipped or no changes"
          
